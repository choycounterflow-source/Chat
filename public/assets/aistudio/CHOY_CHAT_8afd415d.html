<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHOY CHAT</title>
<style>
html, body { margin: 0; padding: 0; background: #fff; }
body { padding: 48px 24px; }

@layer doc-export-base {
	.doc-export *,
	.doc-export *::before,
	.doc-export *::after {
		box-sizing: border-box;
		margin: 0;
		padding: 0;
		/* Not cosmetic: the video card is a <button>, and the editor's rules for it
		   assume it starts with no border of its own. */
		border: 0 solid;
	}
	.doc-export img,
	.doc-export svg,
	.doc-export video,
	.doc-export canvas {
		display: block;
		vertical-align: middle;
	}
	.doc-export img,
	.doc-export video {
		max-width: 100%;
		height: auto;
	}
	.doc-export ul,
	.doc-export ol {
		list-style: none;
	}
	.doc-export h1,
	.doc-export h2,
	.doc-export h3,
	.doc-export h4,
	.doc-export h5,
	.doc-export h6 {
		font-size: inherit;
		font-weight: inherit;
	}
	.doc-export button {
		background: transparent;
		color: inherit;
		font: inherit;
	}
	.doc-export table {
		border-collapse: collapse;
	}
}


.doc-export {
	--background: #ffffff;
	--foreground: #262626;
	--card: #ffffff;
	--card-foreground: #262626;
	--popover: #ffffff;
	--popover-foreground: #262626;
	--secondary: hsl(0 0% 96.1%);
	--secondary-foreground: hsl(0 0% 9%);
	--muted: hsl(0 0% 96.1%);
	--muted-foreground: hsl(0 0% 45.1%);
	--accent: hsl(0 0% 96.1%);
	--accent-foreground: hsl(0 0% 9%);
	--destructive: hsl(355 100% 66%);
	--border: hsl(0 0% 89.8%);
	--input: hsl(0 0% 93%);
	--bd: hsl(0 0% 91%);
	--radius: 0.5rem;
	--bg-main: #ffffff;
	--brand-100: #d2f7e4;
	--brand-500: #00b549;
	--ring: #d2f7e4;
	--primary-foreground: #ffffff;
	--color-brand-100: #d2f7e4;
	--color-brand-500: #00b549;
	--color-primary-100: #d2f7e4;
	--color-primary-500: #00b549;
	/* sRGB spelling of oklch(92.2% 0 0) — see the file header. */
	--color-neutral-200: #e5e5e5;
	--success: #00b327;
	--danger: #fb0406;
	--warning: #fb9100;
	--info: #66bb6a;
	--shadow-xs: 0 4px 12px 0 rgba(0, 0, 0, 0.04);
	--tbl-select: #3b82f6;
}


.doc-export__body {
	white-space: pre-wrap;
	word-wrap: break-word;
	-webkit-font-variant-ligatures: none;
	font-variant-ligatures: none;
	font-feature-settings: "liga" 0;
}
.doc-export__body img.ProseMirror-separator { display: none !important; }

/* Notion-like /docs editor styling. Theme-aware via app CSS variables. KaTeX +
 * highlight.js themes are side-effect imported from ./tiptap-vendor-styles.ts
 * (Turbopack + Tailwind 4's PostCSS pipeline can't resolve bare-specifier
 * @import with media-query conditions, so those vendor sheets moved to JS).
 *
 * EVERY content rule here is scoped to `.tiptap.tiptap-doc-content` — an OPT-IN
 * class the document editors put on their own ProseMirror root (see
 * TiptapCollabEditor and the swarm docs-agent editor). `.tiptap` alone is not a
 * scope: TipTap stamps it on every editor in the app, and this sheet is loaded
 * app-wide the moment any chunk that imports it does. Bare `.tiptap pre` /
 * `code` / `ul` / `img` rules therefore reached the IM composer and the flow
 * prompt dialog too, where they beat those editors' `prose` styling (a plain
 * class rule vs. Tailwind's utilities layer + typography's zero-specificity
 * `:where()`): the composer's code block rendered as a near-invisible light box
 * — Word's grey `--muted` background under prose's light-on-dark text colour.
 * Add the class to a new editor that WANTS document styling; never widen a rule
 * back to bare `.tiptap`.
 *
 * Fills and rules use UI 2.0's roles, --bg-subtle and --border-main, not
 * shadcn's --muted / --border: nothing themes those two for dark, where --muted
 * stayed `hsl(0 0% 3.9%)` (near-black code chips, code blocks and table
 * headers) and --border a faint #262626. The inputs inside the floating menus
 * keep --background, which matches the menus' own --popover. */

/* Table SELECTION blue (Lark-style), deliberately not the brand colour: a
   selected column/row has to read as "selected range", the same signal as the
   blue insert affordances, not as a brand action. Used by the grip strip and the
   insert dots (table/table.css), the selected-cell tint and the column resize
   handle below.
   Declared on :root, NOT on .tiptap-editor-shell: the rules that consume it are
   scoped to the content class above, which every document editor carries —
   including the swarm docs-agent editor, which has resizable tables and no shell
   around it. Scoped to the shell, that editor would resolve an undefined var —
   the whole declaration then drops, leaving the selected-cell tint and the
   resize handle transparent. */
:root {
	--tbl-select: #3b82f6;

	/* Gutter pill geometry — one slot (an affordance button), the pill's padding
	   and its border width. Single source of truth: the pill's own rules read them
	   back, and `.drag-handle` derives its FIXED width from them (see there), so
	   the box floating-ui measures and the box actually painted cannot drift apart.
	   Declared on :root for the same reason as --tbl-select above: the pill classes
	   are reused OUTSIDE the gutter — the table's in-cell "+"
	   (`.tiptap-cell-add-pill`, see table/table.css) is a
	   `.tiptap-drag-handle-group` in an overlay of its own, with no `.drag-handle`
	   ancestor. Scoped to the handle, that pill would resolve undefined vars and
	   drop its padding, border and button width entirely. */
	--gutter-slot: 20px;
	--gutter-pill-pad: 2px;
	--gutter-pill-border: 1px;
	/* Breathing room between the pill's right edge and the block's left edge.
	   Carried as PADDING on `.drag-handle` (not a transform), so the gap is part
	   of the handle's own hit area: the pointer crossing it from the text is
	   still "inside the handle" and the plugin's mouseleave never hides the pill
	   mid-travel. The hover corridor below extends across it for the same
	   reason. */
	--gutter-text-gap: 6px;
}

.tiptap-editor-shell {
	position: relative;
}

/* Body editor only — scoped to the shell so the single-line title editor (also
 * .tiptap.ProseMirror, rendered in the header) never inherits the body padding
 * or the body placeholder rule. */
.tiptap-editor-shell .tiptap.ProseMirror {
	outline: none;
	padding: 1rem 0 30vh;
	font-size: 1rem;
	line-height: 1.6;
	color: var(--foreground);
}
.tiptap.tiptap-doc-content.ProseMirror > * + * {
	margin-top: 0.75em;
}
/* TOC jump clearance (TiptapTocPanel) — in CSS, never as an inline style: the
   panel must not write into ProseMirror-owned DOM (see its header note). */
.tiptap.tiptap-doc-content h1,
.tiptap.tiptap-doc-content h2,
.tiptap.tiptap-doc-content h3 {
	scroll-margin-top: 5rem;
}
.tiptap.tiptap-doc-content h1 {
	font-size: 1.875em;
	font-weight: 700;
	line-height: 1.2;
	margin-top: 1.4em;
}
.tiptap.tiptap-doc-content h2 {
	font-size: 1.5em;
	font-weight: 700;
	margin-top: 1.2em;
}
.tiptap.tiptap-doc-content h3 {
	font-size: 1.25em;
	font-weight: 600;
	margin-top: 1em;
}
.tiptap.tiptap-doc-content ul,
.tiptap.tiptap-doc-content ol {
	padding-left: 1.25em;
}
.tiptap.tiptap-doc-content ul {
	list-style: disc;
}
.tiptap.tiptap-doc-content ol {
	list-style: decimal;
}
/* One marker per LEVEL (Lark).
 *
 * The two rules above are DESCENDANT selectors, so they painted every level
 * with the top level's marker: a row sunk under the one above it kept the same
 * solid bullet and read as a sibling that had merely drifted right — the nesting
 * was there in the document and nowhere on screen. The marker is what says
 * "second level" where the indent alone cannot: against a wrapped line, a narrow
 * page, or a list that starts already indented.
 *
 * The deepest rule is written with no `:not()` cap on purpose — `ul ul ul`
 * matches the fourth level and beyond too, which is the browser's own default
 * behaviour (square all the way down) rather than a level that suddenly loses
 * its marker.
 *
 * NOT the app-wide `.md-nested-markers` set (styles.css), which spells the same
 * Lark cycle across nine levels for chat markdown. That set out-specifies only
 * `prose`, whose selectors are `:where()`-wrapped and therefore weigh nothing —
 * against the two rules above, `.md-nested-markers ul ul` (0,1,2) LOSES to
 * `.tiptap.tiptap-doc-content ul` (0,2,1), so merely adding the class here would
 * leave every level solid. Matching it would mean re-weighing the document
 * sheet's own list rules; three levels stated at this scope is the smaller
 * change.
 */
.tiptap.tiptap-doc-content ul ul {
	list-style: circle;
}
.tiptap.tiptap-doc-content ul ul ul {
	list-style: square;
}
.tiptap.tiptap-doc-content ol ol {
	list-style: lower-alpha;
}
.tiptap.tiptap-doc-content ol ol ol {
	list-style: lower-roman;
}
/* A list stepped right as a BLOCK is one level deeper too.
 *
 * `data-indent` (withBlockIndent) is the OTHER way a list becomes second-level:
 * Tab on the first row has no row above it to nest under, so the whole list
 * steps right instead. Without this, that list moved 24px and kept its
 * first-level marker — the text had shifted but nothing said it was a level
 * down, which is exactly how "Tab just pushes everything right" was reported.
 *
 * Out-specifies the bare `ul` / `ol` rules by one attribute (0,3,1 vs 0,2,1);
 * `ul[data-indent] ul` keeps the nested step ON TOP of it.
 *
 * A task list keeps its marker-less look by two different mechanisms, and both
 * are load-bearing. At the TOP level its `list-style: none` ties with
 * `ul[data-indent]` at (0,3,1) and wins on source order (it is written later in
 * this file). One level down it would LOSE — `ul[data-indent] ul` is (0,3,2) —
 * so that rule excludes task lists explicitly; without the `:not()` a checklist
 * under an indented list drew a ▪ beside every checkbox.
 */
.tiptap.tiptap-doc-content ul[data-indent] {
	list-style: circle;
}
.tiptap.tiptap-doc-content ul[data-indent] ul:not([data-type="taskList"]) {
	list-style: square;
}
.tiptap.tiptap-doc-content ol[data-indent] {
	list-style: lower-alpha;
}
.tiptap.tiptap-doc-content ol[data-indent] ol {
	list-style: lower-roman;
}
/* Breathing between list ROWS (Lark).
 *
 * The sheet spaces TOP-LEVEL blocks (`> * + *` above, 0.75em) and a list is ONE
 * block, so its rows used to sit at pure line-height: a row break and a line
 * WRAP inside a row were the same distance, and a long list — an outline with
 * nested rows most of all — read as one slab with no grouping in it.
 *
 * Half the block step, deliberately: rows of one list belong together more than
 * two blocks do, and it is the DIFFERENCE between the two distances that makes
 * the grouping visible. Everything a row CONTAINS past its first block gets
 * the same step — a nested list, and a picture or a table put on a line of its
 * own — because the top-level rhythm is a DIRECT-CHILD rule and reaches none of
 * them: inside a row they had no spacing at all, and a picture ended up flush
 * against the line above it. Table cells are the same shape of container, so
 * they take the same step.
 */
.tiptap.tiptap-doc-content li + li,
.tiptap.tiptap-doc-content li > * + *,
.tiptap.tiptap-doc-content td > * + *,
.tiptap.tiptap-doc-content th > * + * {
	margin-top: 0.5em;
}
/* A task row is a FLEX of checkbox + text container, so the step above would
   push the words down away from the box they belong to. */
.tiptap.tiptap-doc-content ul[data-type="taskList"] li > * + * {
	margin-top: 0;
}
.tiptap.tiptap-doc-content ul[data-type="taskList"] {
	list-style: none;
	padding-left: 0.25em;
}
.tiptap.tiptap-doc-content ul[data-type="taskList"] li {
	display: flex;
	gap: 0.5em;
	align-items: flex-start;
}
/* Center the checkbox against the first text line: the label gets a box as tall
 * as one line (line-height 1.6) and centers the checkbox inside it, so single-
 * line items read as vertically centered while multi-line items keep the
 * checkbox pinned to the first line rather than the block's middle. */
.tiptap.tiptap-doc-content ul[data-type="taskList"] li > label {
	display: inline-flex;
	align-items: center;
	height: 1.6em;
	margin: 0;
	user-select: none;
}
.tiptap.tiptap-doc-content ul[data-type="taskList"] li > div {
	flex: 1 1 auto;
	min-width: 0;
}
/* Centered / right-aligned task rows: the row is a FLEX of checkbox + text
   container, so text-align alone moves the words and strands the checkbox at
   the left edge. Let the whole row follow the paragraph's alignment: shrink
   the text container to its content and justify the flex row. */
.tiptap.tiptap-doc-content
	ul[data-type="taskList"]
	li:has(> div > p[style*="text-align: center"]) {
	justify-content: center;
}
.tiptap.tiptap-doc-content
	ul[data-type="taskList"]
	li:has(> div > p[style*="text-align: right"]) {
	justify-content: flex-end;
}
.tiptap.tiptap-doc-content
	ul[data-type="taskList"]
	li:has(> div > p[style*="text-align: center"])
	> div,
.tiptap.tiptap-doc-content
	ul[data-type="taskList"]
	li:has(> div > p[style*="text-align: right"])
	> div {
	flex: 0 1 auto;
}
.tiptap.tiptap-doc-content blockquote {
	border-left: 3px solid var(--border-main);
	padding-left: 1em;
	color: var(--muted-foreground);
}
.tiptap.tiptap-doc-content a {
	color: var(--color-primary-500);
	text-decoration: underline;
	cursor: pointer;
}
/*
 * Inline code, and the ONE place scoping changed what a document renders.
 *
 * components/editor/tiptap.css (loaded app-wide) styles inline code for every
 * TipTap surface as `.tiptap :not(pre) > code` — which used to out-specify the
 * bare `.tiptap code` here (0,1,2 vs 0,1,1), so a document editor silently wore
 * the shared slate-100 chip. With the scope class this rule is (0,2,1) and wins,
 * and that is the DECISION: a document uses the document sheet's own chip
 * (--muted, 0.9em) — the shared sheet is for the composer and the read-only
 * markdown renders. It still supplies `color` and drops prose's backticks here,
 * since this rule declares neither.
 */
.tiptap.tiptap-doc-content code {
	background: var(--bg-subtle);
	border-radius: 4px;
	padding: 0.15em 0.35em;
	font-size: 0.9em;
}
.tiptap.tiptap-doc-content pre {
	background: var(--bg-subtle);
	border-radius: 8px;
	padding: 0.9em 1em;
	overflow-x: auto;
}
.tiptap.tiptap-doc-content pre code {
	background: none;
	padding: 0;
	font-size: 0.875em;
}

/* The code block's chrome: the header strip (ui/CodeBlockView) and the gutter
   (code-block-fold.ts). The strip and the <pre> read as ONE card — the wrapper
   carries the background and the rounding, and the <pre> gives up both so the
   two cannot separate at the seam. */
.tiptap.tiptap-doc-content .tiptap-code-block {
	/* The gutter's width in REM, because it is used on two elements with
	   different font sizes (the <pre>'s padding and the number cells) and in em
	   the two would not be the same length. The line height in EM on purpose,
	   the opposite reason: each cell's strip has to be exactly one line box of
	   the CODE tall, and em resolves against whoever uses it. */
	--code-gutter: 3.2rem;
	--code-line: 1.55em;
	--code-font: 0.875em;
	background: var(--bg-subtle);
	border-radius: 8px;
	margin: 0.5em 0;
	overflow: hidden;
}
.tiptap.tiptap-doc-content .tiptap-code-block pre {
	background: none;
	border-radius: 0;
	margin: 0;
	overflow-x: auto;
	/* The left padding IS the gutter: the number cells are painted into it from
	   out of flow, so nothing in a line can push the text or cover the caret. */
	padding: 0.4em 1em 0.9em var(--code-gutter, 3.2rem);
}
/* Stated, not inherited. A code block scrolls sideways unless the reader asks
   for wrapping, and the ancestors have opinions: the shared prose preset gives
   every span inside it `overflow-wrap: anywhere`, which broke long lines in a
   narrow window even though nothing here asked for it. */
.tiptap.tiptap-doc-content .tiptap-code-block pre,
.tiptap.tiptap-doc-content .tiptap-code-block pre code,
.tiptap.tiptap-doc-content .tiptap-code-block pre code span {
	overflow-wrap: normal;
	white-space: pre;
	word-break: normal;
}
/* Percentages inside resolve against the <pre>'s content box, which is what the
   wrapped-line width below needs. The line height is STATED so the gutter's
   one-line strips tile seamlessly instead of leaving gaps the scrolled code
   shows through. */
.tiptap.tiptap-doc-content .tiptap-code-block pre code {
	display: block;
	font-size: var(--code-font, 0.875em);
	line-height: 1.55;
}
.tiptap-code-head {
	align-items: center;
	display: flex;
	gap: 6px;
	padding: 6px 8px 4px 6px;
	user-select: none;
}
.tiptap-code-spacer {
	flex: 1 1 auto;
}
.tiptap-code-sep {
	background: var(--border-main);
	flex: none;
	height: 14px;
	width: 1px;
}
.tiptap-code-fold {
	align-items: center;
	appearance: none;
	background: none;
	border: 0;
	border-radius: 4px;
	color: var(--muted-foreground);
	cursor: pointer;
	display: inline-flex;
	height: 20px;
	justify-content: center;
	padding: 0;
	transition: transform 120ms ease;
	width: 20px;
}
.tiptap-code-fold:hover {
	background: var(--accent);
	color: var(--foreground);
}
/* The chevron points DOWN when open and RIGHT when folded. */
.tiptap-code-block[data-collapsed="true"] .tiptap-code-fold {
	transform: rotate(-90deg);
}
.tiptap-code-title,
.tiptap-code-lines {
	color: var(--muted-foreground);
	font-size: 12px;
}
/* The three controls on the right — language, wrap, copy — and the rules
   between them appear with the pointer, the way the fold triangles do. The
   fold control and the block's name stay: they say what this is, the others
   are things to do to it. */
.tiptap-code-lang,
.tiptap-code-action,
.tiptap-code-more,
.tiptap-code-sep {
	opacity: 0;
	transition: opacity 120ms ease;
}
.tiptap-code-block:hover .tiptap-code-lang,
.tiptap-code-block:hover .tiptap-code-action,
.tiptap-code-block:hover .tiptap-code-more,
.tiptap-code-block:hover .tiptap-code-sep,
.tiptap-code-block[data-controls="shown"] .tiptap-code-lang,
.tiptap-code-block[data-controls="shown"] .tiptap-code-action,
.tiptap-code-block[data-controls="shown"] .tiptap-code-more,
.tiptap-code-block[data-controls="shown"] .tiptap-code-sep,
.tiptap-code-lang:focus-visible,
.tiptap-code-action:focus-visible,
.tiptap-code-more:focus-visible {
	opacity: 1;
}
/* A touch screen never hovers, so the strip would stay invisible and the "…"
   it folds into would be unreachable. Nothing fades there: the controls are
   simply present. */
@media (pointer: coarse) {
	.tiptap-code-lang,
	.tiptap-code-action,
	.tiptap-code-more,
	.tiptap-code-sep {
		opacity: 1;
	}
}
.tiptap-code-lang,
.tiptap-code-action,
.tiptap-code-more {
	align-items: center;
	appearance: none;
	background: none;
	border: 0;
	border-radius: 4px;
	color: var(--muted-foreground);
	cursor: pointer;
	display: inline-flex;
	font-size: 12px;
	gap: 4px;
	padding: 2px 6px;
}
.tiptap-code-lang:hover,
.tiptap-code-action:hover {
	background: var(--accent);
	color: var(--foreground);
}
.tiptap-code-action[data-active="true"] {
	color: var(--color-primary-500);
}
.tiptap-code-lang:disabled {
	cursor: default;
	opacity: 0.7;
}
.tiptap-code-lang:disabled:hover {
	background: none;
	color: var(--muted-foreground);
}
.tiptap-code-menu-item {
	align-items: center;
	appearance: none;
	background: none;
	border: 0;
	border-radius: 4px;
	color: var(--foreground);
	cursor: pointer;
	display: flex;
	font-size: 13px;
	gap: 8px;
	padding: 7px 8px;
	text-align: left;
	width: 100%;
}
.tiptap-code-menu-item:hover {
	background: var(--accent);
}
.tiptap-code-menu-item[data-active="true"] {
	color: var(--color-primary-500);
}
.tiptap-code-lang-search {
	background: var(--background);
	border: 1px solid var(--border-main);
	border-radius: 6px;
	color: var(--foreground);
	font-size: 13px;
	height: 28px;
	margin-bottom: 4px;
	padding: 0 8px;
	width: 100%;
}
.tiptap-code-lang-search:focus {
	border-color: var(--color-primary-500);
	outline: none;
}
.tiptap-code-lang-list {
	list-style: none;
	margin: 0;
	max-height: 240px;
	overflow-y: auto;
	padding: 0;
}
.tiptap-code-lang-item {
	appearance: none;
	background: none;
	border: 0;
	border-radius: 4px;
	color: var(--foreground);
	cursor: pointer;
	display: block;
	font-size: 13px;
	padding: 4px 8px;
	text-align: left;
	width: 100%;
}
.tiptap-code-lang-item:hover {
	background: var(--accent);
}
.tiptap-code-lang-item[data-active="true"] {
	color: var(--color-primary-500);
	font-weight: 600;
}
/* Hidden, never unmounted: the content DOM is ProseMirror's and has to stay in
   the tree — removing it would tear the node view's contract. */
.tiptap-code-block[data-collapsed="true"] pre {
	display: none;
}
.tiptap-code-block[data-collapsed="true"] .tiptap-code-head {
	padding-bottom: 6px;
}
/* Wrapping is the reader's choice (the strip's switch). Off, the block scrolls
   sideways; on, long lines break and the gutter still lines up because each
   number is laid out in front of its own line rather than measured. */
.tiptap.tiptap-doc-content .tiptap-code-block[data-wrap="true"] pre {
	overflow-x: visible;
}
.tiptap.tiptap-doc-content .tiptap-code-block[data-wrap="true"] pre code,
.tiptap.tiptap-doc-content .tiptap-code-block[data-wrap="true"] pre code span {
	overflow-wrap: anywhere;
	white-space: pre-wrap;
}
/* Nothing is needed for the wrapped rows: the gutter is the <pre>'s left
   padding, so the code's content box starts where the code does and a wrapped
   row already lines up with the row above it. */

/* The height handle under the block: a grab strip the full width, with the
   grip drawn in the middle of it. Full width because a 40px pill is a small
   target for a drag, and centred because that is where the eye looks for it.
   Only the grip is painted, and only on hover — the strip itself is invisible
   chrome. */
.tiptap-code-resize {
	align-items: center;
	appearance: none;
	background: none;
	border: 0;
	cursor: ns-resize;
	display: flex;
	height: 12px;
	justify-content: center;
	padding: 0;
	touch-action: none;
	width: 100%;
}
.tiptap-code-resize-grip {
	background: var(--muted-foreground);
	border-radius: 999px;
	height: 3px;
	opacity: 0;
	transition: opacity 120ms ease;
	width: 44px;
}
.tiptap-code-block:hover .tiptap-code-resize-grip,
.tiptap-code-resize:focus-visible .tiptap-code-resize-grip {
	opacity: 0.45;
}
.tiptap-code-resize:hover .tiptap-code-resize-grip,
.tiptap-code-resize:active .tiptap-code-resize-grip {
	opacity: 0.8;
}

/* The gutter column: line numbers and fold triangles, drawn BESIDE the code.
   Nothing here is part of the document — the whole column is rendered by the
   node view outside the content DOM (ui/CodeBlockView), because a number that
   sits in the text competes with the caret for the same position.

   Zero-sized and sticky at the top-left of the code, with each row absolutely
   positioned under the last: sticky holds the column in place while a long line
   scrolls sideways underneath it, and zero size keeps it out of the line boxes
   entirely. Rows are placed by arithmetic, not measurement — the code's line
   height is stated (see the <code> rule above), so row N sits at N line
   heights. */
.tiptap-code-gutter {
	display: block;
	/* The code's size, not the <pre>'s. The column lives beside <code> rather
	   than inside it, and `--code-line` is in em — measured against the wrong
	   font it made every row 14% too tall, so the numbers drifted a line further
	   from their code with every line. */
	font-size: var(--code-font, 0.875em);
	height: 0;
	left: 0;
	position: sticky;
	user-select: none;
	width: 0;
}
.tiptap-code-gutter-row {
	/* Opaque: this is what the code passes behind when a long line scrolls. The
	   rows are exactly one line tall each, so they tile into a continuous strip
	   without leaving seams. */
	background: var(--bg-subtle);
	display: block;
	height: var(--code-line, 1.55em);
	position: absolute;
	/* Anchored to the column's RIGHT edge, which stands at the line start: the
	   row then covers the padding strip to its left, which is the gutter. */
	right: 0;
	width: var(--code-gutter, 3.2rem);
}
.tiptap-code-lineno {
	align-items: center;
	color: var(--muted-foreground);
	display: flex;
	font-variant-numeric: tabular-nums;
	height: var(--code-line, 1.55em);
	justify-content: flex-end;
	position: absolute;
	right: 1.15rem;
	top: 0;
	width: 2rem;
}
/* Between the number and the code, the way an editor's fold column sits.
   Shown while the pointer is on the block — a column of triangles beside code
   nobody is reaching for is decoration. Two exceptions stay lit: a triangle
   holding a fold CLOSED says where the missing lines went, and a focused one
   has to be visible to whoever tabbed to it. Opacity, not display, so the
   numbers never shift as they come and go. */
.tiptap-code-arrow {
	align-items: center;
	appearance: none;
	background: none;
	border: 0;
	color: var(--muted-foreground);
	cursor: pointer;
	display: flex;
	height: var(--code-line, 1.55em);
	justify-content: center;
	opacity: 0;
	padding: 0;
	position: absolute;
	right: 0.15rem;
	top: 0;
	transition: opacity 120ms ease;
	width: 0.85rem;
}
.tiptap-code-block:hover .tiptap-code-arrow,
.tiptap-code-arrow[data-folded="true"],
.tiptap-code-arrow:focus-visible {
	opacity: 1;
}
/* A CSS triangle rather than a glyph: the same shape in every font. */
.tiptap-code-arrow::before {
	border: 3.5px solid transparent;
	border-top-color: currentColor;
	content: "";
	display: block;
	margin-top: 3.5px;
	transition: transform 120ms ease;
}
.tiptap-code-arrow:hover {
	color: var(--foreground);
}
.tiptap-code-arrow[data-folded="true"]::before {
	transform: rotate(-90deg) translate(2px, 2px);
}

/* The folded characters themselves. */
.tiptap-code-folded {
	display: none;
}
.tiptap-code-fold-mark {
	background: var(--accent);
	border-radius: 4px;
	color: var(--muted-foreground);
	cursor: pointer;
	margin-left: 0.4em;
	padding: 0 0.35em;
	user-select: none;
}
/* Grey, not the brand colour: this mark sits INSIDE the code, and a bright
   hover there reads as syntax rather than as a control. */
.tiptap-code-fold-mark:hover {
	background: color-mix(in oklab, var(--foreground) 16%, transparent);
	color: var(--foreground);
}
.tiptap.tiptap-doc-content hr {
	/* One pixel of ink, but a box the pointer can actually land on: the gutter
	   handle appears for whatever block is under the cursor, and a 1px-tall
	   element is almost unhittable between its two neighbours. The padding
	   widens the target to a comfortable band and `content-box` clipping keeps
	   the line itself a hairline in the middle of it; the margin comes down by
	   as much as the padding adds, so the spacing on the page is unchanged. */
	background: var(--border-main);
	background-clip: content-box;
	border: none;
	box-sizing: content-box;
	height: 1px;
	margin: 1em 0;
	padding: 8px 0;
}
/* Content images — exclude PM separator. With Image.resize enabled the node
   is wrapped in [data-resize-container][data-node=image], so layout rules
   target that wrapper (not bare p > img). */
.tiptap.tiptap-doc-content
	img:not(.ProseMirror-separator):not(.tiptap-mention__avatar) {
	border-radius: 8px;
	height: auto;
	max-width: 100%;
	vertical-align: bottom;
}
/* No `display` here, and none in the mixed-content rule further down: the
   container's display is an INLINE style, written by @tiptap/core's
   ResizableNodeView (`createContainer` sets `element.style.display = "flex"`),
   and an author rule cannot outrank it. Both rules used to claim
   `display: inline-flex`, which never applied — so two pictures sharing a
   paragraph with text stack vertically rather than sitting side by side, and a
   rule saying otherwise sent more than one reader down the wrong path. The
   rules that DO decide the layout are the width ones below plus
   `.tiptap-image-row`, which work on a block-level box either way. */
.tiptap.tiptap-doc-content [data-resize-container][data-node="image"] {
	line-height: 0;
	max-width: 100%;
	vertical-align: bottom;
}
/* The container PLACES the picture; it does not take the presses.
   A picture that has never been resized is laid out in a box as wide as the
   line (see the width rules below), while the picture itself keeps its own
   size — the wrapper inside is a flex item and does not grow. Everything to
   the right of a picture narrower than its column was therefore still this
   element, and a press on that empty strip selected the picture instead of
   putting the caret on the line. It stops being a target; the wrapper, which
   is exactly the picture and its handles, keeps being one.
   Narrowing the box instead is not open: the same rules widen it on purpose,
   and the selection outline below is already drawn on the <img> rather than
   here for that very reason. Both DOM walks that look for this container
   (the hover toolbar, the edge affordance) use `closest`, which climbs the
   DOM and is unaffected. */
.tiptap.tiptap-doc-content [data-resize-container][data-node="image"] {
	pointer-events: none;
}
.tiptap.tiptap-doc-content
	[data-resize-container][data-node="image"]
	[data-resize-wrapper] {
	pointer-events: auto;
}
/* The wrapper ResizableNodeView puts between the container and the picture is
   a FLEX ITEM, and a flex item's default `min-width: auto` refuses to shrink
   below its content's minimum — which for a picture carrying an inline width
   is that width. So a picture wider than its column kept the wrapper (and the
   resize handles hanging off it) at full size, spilling over the cell next to
   it: a press there landed on the picture's own DOM, which re-selected the
   picture instead of putting the caret in the cell that was clicked. */
.tiptap.tiptap-doc-content
	[data-resize-container][data-node="image"]
	[data-resize-wrapper] {
	max-width: 100%;
	min-width: 0;
}
.tiptap.tiptap-doc-content [data-resize-container][data-node="image"] img {
	display: block;
	max-width: 100%;
}
/* The height must always FOLLOW the rendered width, so a picture keeps its
   proportions when `max-width: 100%` caps it — the cap is the column inside a
   table cell, which the user can drag narrower than the picture, and dragging
   the picture wider than its column used to grow the height alone.
   `!important` because @tiptap/core's ResizableNodeView writes an inline px
   height into this element on mount (applyInitialSize) and on every frame of a
   resize drag: an author-level rule cannot outrank that. The proportions
   themselves come from the `aspect-ratio` docs-image.ts sets from the node's
   width/height attrs (or from the bitmap when it has none). */
.tiptap.tiptap-doc-content [data-resize-container][data-node="image"] img {
	height: auto !important;
}
/* A paragraph ENDING in a media node gets PM's caret artifacts rendered after
   it (img.ProseMirror-separator + br.ProseMirror-trailingBreak) — an empty
   line box under the image. At the TOP LEVEL that line is dead: the caret is
   never allowed to rest there (MediaDeleteGuard's normalizer slides it into
   the neighbouring block), so it reads as a clickable gap that does nothing,
   and it is hidden.

   DIRECT CHILDREN OF THE EDITOR (`> p`, exactly the `$from.depth === 1` the
   normalizer tests) AND TABLE CELLS. Inside a LIST ROW the caret is
   deliberately left alone there, and that empty line is the ONLY place it can
   land: a picture that has a line to itself (the `display: flex` rules below)
   leaves no sliver of text beside it to click. Hidden, every press on the
   picture's row missed the paragraph entirely — the browser gave the nearest
   line it could still see, which is the NEXT list row, so "1. 文字[图片]" +
   a click to the right of the picture + typing put the words in step 2.
   Restored, the press lands under the picture, in the row it was aimed at, and
   text can be added after the picture (or, one ArrowLeft past it, before).

   A TABLE CELL is not a list row. A press on the blank around a picture in a
   cell never reaches ProseMirror's own caret placement: `caretForPress`
   (TiptapCollabEditor.tsx) answers it unconditionally by opening a REAL line on
   the side pressed, and there is no row below the cell for the browser to hand
   a missed press to — the cell is the whole target. So in a cell the artifact
   line bought nothing and cost a line's height: the picture's paragraph was a
   line taller than the picture, the cell's bottom border sat a line below it,
   and the "empty line" it showed could not be deleted, because it is not a
   node. Hidden here too. The line above still comes from the edge affordance
   or a press beside the picture, the line below from Enter on the selected
   picture.

   In a cell, EXCEPT WHILE THE CARET IS ON IT. Nothing keeps a caret out of
   that position in a cell — ArrowRight off a selected picture, End, a step into
   the cell all land there — and with the line hidden it had no box to be drawn
   in: the caret was there, typing went there, and nobody could see it. While
   it sits there the paragraph carries `tiptap-caret-after-media` (the
   caretAfterMediaLine decoration, tiptap-editor-extensions.tsx, which sets it
   in table cells only) and the line shows; it folds away again as soon as the
   caret leaves.

   The `+` adjacency keeps this to that exact pattern — a hardBreak after the
   media breaks the chain, so a legacy [image, hardBreak] paragraph keeps its
   visible (and typable) empty line. */
/* !important: prosemirror-view ships `.ProseMirror-separator { display:
   inline !important }`, so a plain rule loses. */
:is(
		.tiptap.tiptap-doc-content,
		.tiptap.tiptap-doc-content td,
		.tiptap.tiptap-doc-content th
	)
	> p:not(.tiptap-caret-after-media)
	> [data-resize-container]
	+ img.ProseMirror-separator,
:is(
		.tiptap.tiptap-doc-content,
		.tiptap.tiptap-doc-content td,
		.tiptap.tiptap-doc-content th
	)
	> p:not(.tiptap-caret-after-media)
	> [data-resize-container]
	+ img.ProseMirror-separator
	+ br.ProseMirror-trailingBreak {
	display: none !important;
}
/* The selection outline belongs to the PICTURE, not to the box that places it.
   The container is the line-filling layout box (see the width rules further
   down: a picture that has never been resized fills its line), so an outline
   on it reads as a selection far wider than what it selected. The <img> is the
   picture itself, at whatever size it is currently rendered. */
.tiptap.tiptap-doc-content
	[data-resize-container][data-node="image"].ProseMirror-selectednode
	img,
.tiptap.tiptap-doc-content
	[data-resize-container][data-node="image"]:has(img.ProseMirror-selectednode)
	img {
	outline: 2px solid var(--color-primary-500);
	outline-offset: 2px;
}
/* A selected image is the one that zooms: the magnifier cursor says the next
   click opens the full-screen viewer (docs-image-preview.ts). Scoped on
   `tiptap-image-zoom`, NOT on the content class alone — that one is shared with
   the swarm docs-agent editor, which has no viewer to open. A read-only
   document has no selection step, so its images show it right away — but only
   the image NODES: a card cover (ui/WorkspaceEmbedCard) is an <img> too and
   clicking it opens the embedded workspace, not a bigger picture. */
.tiptap.tiptap-doc-content.tiptap-image-zoom
	[data-resize-container][data-node="image"].ProseMirror-selectednode
	img,
.tiptap.tiptap-doc-content.tiptap-image-zoom
	[data-resize-container][data-node="image"]:has(img.ProseMirror-selectednode)
	img,
.tiptap.tiptap-doc-content.tiptap-image-zoom[contenteditable="false"]
	[data-resize-container][data-node="image"]
	img,
.tiptap.tiptap-doc-content.tiptap-image-zoom[contenteditable="false"]
	p
	> img:not(.ProseMirror-separator) {
	cursor: zoom-in;
}

/* Exactly one image node in the paragraph → fill the line until the user
   resizes (inline style width then wins; container shrinks to the image). */
.tiptap.tiptap-doc-content
	p:has(> [data-node="image"]):not(
		:has(> [data-node="image"] ~ [data-node="image"])
	)
	> [data-node="image"] {
	display: flex;
	max-width: 100%;
	width: fit-content;
}
/* …unless the paragraph carries an alignment. An image that is being aligned is
   by definition not filling the line, so the fill-the-line default stands down
   and the image keeps its natural size (still capped at 100%) for the margin
   rules below to push around. */
.tiptap.tiptap-doc-content
	p:has(> [data-node="image"]):not([style*="text-align"]):not(
		:has(> [data-node="image"] ~ [data-node="image"])
	)
	> [data-node="image"]:has(
		> [data-resize-wrapper] > img:not([style*="width"])
	) {
	width: 100%;
}
.tiptap.tiptap-doc-content
	p:has(> [data-node="image"]):not([style*="text-align"]):not(
		:has(> [data-node="image"] ~ [data-node="image"])
	)
	> [data-node="image"]:has(> [data-resize-wrapper] > img:not([style*="width"]))
	img {
	width: 100%;
}
/* Aligning an image = aligning the paragraph that carries it (the image node is
   INLINE — see media-selection.ts). `text-align` alone is enough for an image
   sharing its line with text or with another image, because the resize container
   is inline-flex there. The single-image case above promotes it to a BLOCK-level
   flex box, which text-align cannot move — margin can. TextAlign renders
   `style="text-align: <value>"`, hence the attribute match. */
.tiptap.tiptap-doc-content
	p[style*="text-align: center"]:not(.tiptap-image-row)
	> [data-node="image"] {
	margin-inline: auto;
}
.tiptap.tiptap-doc-content
	p[style*="text-align: right"]:not(.tiptap-image-row)
	> [data-node="image"] {
	margin-inline-start: auto;
}
/* Fallback when NodeView is absent (e.g. paste preview): bare img. */
.tiptap.tiptap-doc-content
	p:has(> img:not(.ProseMirror-separator)):not(
		:has(> img:not(.ProseMirror-separator) ~ img:not(.ProseMirror-separator))
	):not(:has(> [data-node="image"]))
	> img:not(.ProseMirror-separator) {
	display: block;
	width: 100%;
}

/* Two+ image nodes in one paragraph — the MIXED-content case (images alongside
   text), which uploads no longer produce (`ownLinePos` in media-upload.ts) but
   old documents still carry. An images-only row opts out: `.tiptap-image-row`
   below lays it out as a flex line whose split the user can drag.
   No `display` — see the container rule above for why one would do nothing. */
.tiptap.tiptap-doc-content
	p:has(> [data-node="image"] ~ [data-node="image"]):not(.tiptap-image-row)
	> [data-node="image"] {
	margin-inline-end: 0.25rem;
	width: auto;
}
/* An equal share is the DEFAULT, not a ceiling: it stops pictures nobody has
   sized from each claiming the whole line. A picture the user HAS dragged is
   honoured at the size they dragged it to — the cap used to outrank the drag,
   so the handle could only ever make such a picture smaller: the width never
   grew on screen, and every mouseup committed that capped width back into the
   node. Same `img:not([style*="width"])` test the single-image and row rules
   use for "has never been sized". */
.tiptap.tiptap-doc-content
	p:has(> [data-node="image"] ~ [data-node="image"]):not(.tiptap-image-row)
	> [data-node="image"]:has(
		> [data-resize-wrapper] > img:not([style*="width"])
	) {
	max-width: calc(50% - 0.25rem);
}
.tiptap.tiptap-doc-content
	p:has(> [data-node="image"] ~ [data-node="image"] ~ [data-node="image"]):not(
		.tiptap-image-row
	)
	> [data-node="image"]:has(
		> [data-resize-wrapper] > img:not([style*="width"])
	) {
	max-width: calc(33.333% - 0.25rem);
}
.tiptap.tiptap-doc-content
	p:has(
		> [data-node="image"]
			~ [data-node="image"]
			~ [data-node="image"]
			~ [data-node="image"]
	):not(.tiptap-image-row)
	> [data-node="image"]:has(
		> [data-resize-wrapper] > img:not([style*="width"])
	) {
	max-width: calc(25% - 0.25rem);
}

/* An images-ONLY row — ProseMirror marks it, because CSS cannot tell whether a
   paragraph also carries text (see image-row-layout.ts). Laying it out as a
   flex line is what makes the split adjustable: an image that has never been
   resized takes an equal share, while one that HAS been resized keeps its
   committed width and the others absorb what is left. So dragging one image
   out to 70% leaves the other at 30% instead of pushing it onto a line of its
   own. flex-shrink with min-width:0 keeps the row on ONE line even when the
   stored widths add up to more than fits — overflowing would wrap an image
   back onto its own line, which is the very thing being fixed. */
.tiptap.tiptap-doc-content p.tiptap-image-row {
	align-items: flex-start;
	display: flex;
	gap: 0.25rem;
}
.tiptap.tiptap-doc-content p.tiptap-image-row > [data-node="image"] {
	flex: 0 1 auto;
	max-width: 100%;
	min-width: 0;
	width: auto;
}
/* Never resized (the NodeView writes an inline width on commit) → equal share
   of the row, filling it the way a single image fills its line. */
.tiptap.tiptap-doc-content
	p.tiptap-image-row
	> [data-node="image"]:has(
		> [data-resize-wrapper] > img:not([style*="width"])
	) {
	flex: 1 1 0;
}
.tiptap.tiptap-doc-content
	p.tiptap-image-row
	> [data-node="image"]:has(> [data-resize-wrapper] > img:not([style*="width"]))
	img {
	width: 100%;
}
/* Row alignment is justify-content once the paragraph is a flex box. */
.tiptap.tiptap-doc-content p.tiptap-image-row[style*="text-align: center"] {
	justify-content: center;
}
.tiptap.tiptap-doc-content p.tiptap-image-row[style*="text-align: right"] {
	justify-content: flex-end;
}

/* Find & replace (find-replace.ts).
   Every match is tinted, and the one the panel is standing on is tinted
   harder — two steps of the brand scale rather than a colour of their own, so
   a brand change reaches the highlight with everything else. Flat tokens, not
   a translucent wash: a match can fall on a table cell, a code block or a
   selected range, and a wash would come out a different colour on each.
   `box-decoration-break` keeps a match that wraps across two lines looking
   like one highlight rather than two boxes. */
.tiptap.tiptap-doc-content .tiptap-find-match {
	background-color: var(--brand-100);
	border-radius: 2px;
	-webkit-box-decoration-break: clone;
	box-decoration-break: clone;
}
.tiptap.tiptap-doc-content .tiptap-find-match.tiptap-find-match--active {
	background-color: var(--brand-300);
}

/* Side-drop indicator: the vertical counterpart of the dropcursor's horizontal
   line. It says the dragged image will JOIN this one's row instead of stacking
   above or below it (see image-side-drop.ts).

   A bar down one EDGE of the target, and drawn with `box-shadow` on purpose:
   a shadow is painted outside the box and takes no room, so arming changes no
   layout at all. What stood here before was a ghost the size of the picture
   about to arrive, which had to open a gap for itself — and that gap moved the
   very picture the side had been read off, under a pointer that had not moved.
   The target kept shifting and the preview read as a judder; the paragraph
   promotion that went with it (block-level picture → inline row) moved it a
   second time. Neither is needed to say "this side of this picture".

   The offset and the negative spread make a 3px bar sitting 3px clear of the
   picture, in the gap the dropped one will fill. On the <img> rather than on
   its container, which for a picture that was never resized is as wide as the
   whole column — a bar out at the column's edge points at nothing. */
.tiptap.tiptap-doc-content [data-node="image"].is-side-drop-before img {
	box-shadow: -6px 0 0 -3px var(--color-primary-500);
}
.tiptap.tiptap-doc-content [data-node="image"].is-side-drop-after img {
	box-shadow: 6px 0 0 -3px var(--color-primary-500);
}

/* The stand-in the browser photographs to carry under the cursor during a drag
   (media-drag-image.ts). Off SCREEN rather than hidden, because a browser
   photographs a rendered element and `display: none` / `visibility: hidden` /
   `opacity: 0` all come back as nothing — the fade has to be partial to survive
   being photographed at all.

   It lives on <body>, outside the editor, and is anchored on a class of ours
   rather than on `.tiptap` (see lib/styles/css-scope-guard.test.ts) — the
   editor scope classes it also carries are there so the picture inside it keeps
   the looks the document gave it. */
.tiptap-drag-image {
	position: fixed;
	top: 0;
	left: -10000px;
	pointer-events: none;
}
/* The fade goes on what is INSIDE the stand-in, not on the stand-in itself:
   the snapshot is painted starting AT that element, and a compositing property
   on the thing being painted from is the one thing that may not make it into
   the picture. One level in it is ordinary content, painted like any other. */
.tiptap-drag-image > * {
	opacity: 0.5;
}

/* In-document upload placeholder (a decoration, not a node — see
   media-upload-placeholder.ts). Sits exactly where the media will appear, so the
   wait happens on the page instead of in a toast. */
.tiptap.tiptap-doc-content .tiptap-media-placeholder {
	align-items: center;
	background: var(--bg-subtle);
	border: 1px dashed var(--border-main);
	border-radius: 8px;
	color: var(--muted-foreground);
	display: inline-flex;
	font-size: 0.875em;
	gap: 0.5em;
	margin: 0.25em 0;
	padding: 0.75em 1em;
	user-select: none;
	vertical-align: middle;
}
.tiptap.tiptap-doc-content .tiptap-media-placeholder__spinner {
	animation: tiptap-media-placeholder-spin 0.8s linear infinite;
	block-size: 1em;
	border: 2px solid color-mix(in oklab, currentcolor 25%, transparent);
	border-radius: 50%;
	border-top-color: currentcolor;
	box-sizing: border-box;
	display: inline-block;
	inline-size: 1em;
}
.tiptap.tiptap-doc-content .tiptap-media-placeholder__percent {
	font-variant-numeric: tabular-nums;
	opacity: 0.75;
}
@keyframes tiptap-media-placeholder-spin {
	to {
		transform: rotate(360deg);
	}
}
@media (prefers-reduced-motion: reduce) {
	.tiptap.tiptap-doc-content .tiptap-media-placeholder__spinner {
		animation-duration: 2.4s;
	}
}

/* Uploaded video files (the `video` node — NOT the youtube embed). A block
   player that never overflows the page and reads as one selectable unit.
   Height is capped as well as width: a PORTRAIT clip stretched to the column
   width becomes taller than the viewport and pushes the whole document off
   screen. Both axes are `auto` under the two caps, so the player shrinks to fit
   with its aspect ratio intact (no letterbox bars) and is centred in the
   column — a landscape clip still fills the width as before. */
.tiptap.tiptap-doc-content video.tiptap-video {
	background: #000;
	border-radius: 8px;
	display: block;
	height: auto;
	margin: 0.75em auto;
	max-height: 60vh;
	max-width: 100%;
	width: auto;
}
.tiptap.tiptap-doc-content video.tiptap-video.ProseMirror-selectednode {
	outline: 2px solid var(--color-primary-500);
	outline-offset: 2px;
}

/* The other two display modes of the SAME `video` node (bubble toolbar → 内联 /
   卡片; see docs-video.ts). Both are a button that swaps itself for the player
   on click — `data-playing` is view state written by the node view, never a
   document change, so it is safe to style on. */
.tiptap.tiptap-doc-content .tiptap-video-file {
	display: block;
	margin: 0.5em 0;
	max-width: 100%;
}
.tiptap.tiptap-doc-content
	.tiptap-video-file[data-playing="true"]
	> .tiptap-video-file__open {
	display: none;
}
.tiptap.tiptap-doc-content .tiptap-video-file__open {
	align-items: center;
	background: var(--background);
	color: inherit;
	cursor: pointer;
	display: inline-flex;
	font: inherit;
	max-width: 100%;
	text-align: left;
}
.tiptap.tiptap-doc-content .tiptap-video-file__icon {
	align-items: center;
	color: var(--color-primary-500);
	display: inline-flex;
	flex: none;
	justify-content: center;
}
.tiptap.tiptap-doc-content .tiptap-video-file__name {
	overflow: hidden;
	overflow-wrap: anywhere;
}
.tiptap.tiptap-doc-content
	.tiptap-video-file.ProseMirror-selectednode
	.tiptap-video-file__open {
	outline: 2px solid var(--color-primary-500);
	outline-offset: 2px;
}

/* Card: icon, name, size, play button. Bounded width — a file card that grows to
   the column reads as a broken player rather than as a card. */
.tiptap.tiptap-doc-content
	.tiptap-video-file[data-video-display="card"]
	> .tiptap-video-file__open {
	border: 1px solid var(--border-main);
	border-radius: 10px;
	gap: 12px;
	padding: 10px 14px;
	width: min(100%, 380px);
}
.tiptap.tiptap-doc-content
	.tiptap-video-file[data-video-display="card"]
	.tiptap-video-file__icon {
	background: var(--accent);
	border-radius: 8px;
	height: 40px;
	width: 40px;
}
.tiptap.tiptap-doc-content .tiptap-video-file__meta {
	display: flex;
	flex: 1 1 auto;
	flex-direction: column;
	gap: 2px;
	min-width: 0;
}
.tiptap.tiptap-doc-content
	.tiptap-video-file[data-video-display="card"]
	.tiptap-video-file__name {
	/* Two lines, then ellipsis: CDN file names are long hashes. */
	-webkit-box-orient: vertical;
	-webkit-line-clamp: 2;
	display: -webkit-box;
	font-size: 14px;
	line-height: 1.35;
}
.tiptap.tiptap-doc-content .tiptap-video-file__size {
	color: var(--muted-foreground);
	font-size: 12px;
	line-height: 1.2;
}
.tiptap.tiptap-doc-content .tiptap-video-file__play {
	align-items: center;
	color: var(--muted-foreground);
	display: inline-flex;
	flex: none;
	justify-content: center;
}

/* Chip: icon + name only, sized like the surrounding text. The node is a BLOCK
   in the schema, so the chip sits on its own line rather than flowing inside a
   paragraph — it is a compact attachment, not an inline run. */
.tiptap.tiptap-doc-content
	.tiptap-video-file[data-video-display="inline"]
	> .tiptap-video-file__open {
	background: var(--accent);
	border: none;
	border-radius: 6px;
	gap: 6px;
	padding: 2px 8px;
}
.tiptap.tiptap-doc-content
	.tiptap-video-file[data-video-display="inline"]
	.tiptap-video-file__name {
	font-size: 0.95em;
	white-space: nowrap;
	text-overflow: ellipsis;
}

/* Resize handles (TipTap ResizableNodeView does not ship styles).

   INVARIANT — a handle's `pointer-events` must NEVER be decided by a `:hover`
   that the handle's own hit-testing produces. Each handle is pushed ~40% OUTSIDE
   the box it drags (the transforms further down), and over that outer sliver the
   handle is the only thing there. Gating `pointer-events` on the container's
   `:hover` made the sliver bistable: with the handle inert the pointer fell
   through to the paragraph, so nothing got `:hover`, so the handle stayed inert.
   Approaching a corner from outside the picture therefore found a dead zone, and
   a jiggle across the boundary flipped the cursor between the resize arrow and
   the caret several times a second. A collab NodeView remount resets the same
   hover under a resting pointer, which is why it read as "resize stops working
   after the document has been sitting a while". Handles are hit-testable at all
   times now and only their `opacity` follows the hover: an invisible handle
   still owns its corner, and that is what makes the gesture reproducible.
   Ref Teamily-Inc/teamily-ai-all#1526 */
.tiptap.tiptap-doc-content [data-resize-handle] {
	background: var(--color-primary-500);
	border: 1.5px solid #fff;
	border-radius: 2px;
	box-shadow: 0 0 0 1px
		color-mix(in oklab, var(--color-primary-500) 40%, transparent);
	box-sizing: border-box;
	opacity: 0;
	pointer-events: auto;
	z-index: 3;
}
/* The grab area is bigger than the dot that is drawn: a 10px target is a coin
   toss at speed, and this ring takes it to 18px without changing the look. */
.tiptap.tiptap-doc-content [data-resize-handle]::before {
	content: "";
	inset: -4px;
	position: absolute;
}
.tiptap.tiptap-doc-content
	[data-resize-container][data-node="image"]:hover
	[data-resize-handle],
.tiptap.tiptap-doc-content
	[data-resize-container][data-node="image"]
	[data-resize-wrapper]:hover
	[data-resize-handle],
.tiptap.tiptap-doc-content
	[data-resize-container][data-node="image"].ProseMirror-selectednode
	[data-resize-handle],
.tiptap.tiptap-doc-content
	[data-resize-container][data-resize-state="true"]
	[data-resize-handle] {
	opacity: 1;
}
/* …and a handle the pointer is on shows itself, without asking an ancestor
   whether it is hovered: a remount drops the container's `:hover` until the
   mouse moves again, and the handle under a resting pointer must not go
   invisible underneath it. */
.tiptap.tiptap-doc-content [data-resize-handle]:hover {
	opacity: 1;
}
/* A read-only document has no resize gesture at all. ResizableNodeView attaches
   its handles unconditionally in the constructor and only drops them on the next
   `update` event, so a NodeView remounted by a remote edit carries live handles
   until then — invisible, but hit-testable now, i.e. eating the corners of a
   picture nobody is allowed to resize. */
.tiptap.tiptap-doc-content[contenteditable="false"] [data-resize-handle] {
	display: none;
}
.tiptap.tiptap-doc-content [data-resize-handle="top-left"],
.tiptap.tiptap-doc-content [data-resize-handle="top-right"],
.tiptap.tiptap-doc-content [data-resize-handle="bottom-left"],
.tiptap.tiptap-doc-content [data-resize-handle="bottom-right"] {
	height: 10px;
	width: 10px;
}
/* Each handle straddles the edge it drags: the same fraction outside on all
   four corners and both sides, or the picture looks like it has one loose
   corner. */
.tiptap.tiptap-doc-content [data-resize-handle="top-left"] {
	cursor: nwse-resize;
	transform: translate(-40%, -40%);
}
.tiptap.tiptap-doc-content [data-resize-handle="top-right"] {
	cursor: nesw-resize;
	transform: translate(40%, -40%);
}
.tiptap.tiptap-doc-content [data-resize-handle="bottom-left"] {
	cursor: nesw-resize;
	transform: translate(-40%, 40%);
}
.tiptap.tiptap-doc-content [data-resize-handle="bottom-right"] {
	cursor: nwse-resize;
	transform: translate(40%, 40%);
}
.tiptap.tiptap-doc-content [data-resize-handle="left"],
.tiptap.tiptap-doc-content [data-resize-handle="right"] {
	cursor: ew-resize;
	height: 28px;
	margin-top: auto;
	margin-bottom: auto;
	top: 0;
	bottom: 0;
	width: 6px;
}
.tiptap.tiptap-doc-content [data-resize-handle="left"] {
	transform: translateX(-40%);
}
.tiptap.tiptap-doc-content [data-resize-handle="right"] {
	transform: translateX(40%);
}

/* Vertical breathing room around tables so adjacent tables don't touch. The
   block-level child is the `.tableWrapper` (extension-table wraps tables for
   horizontal scroll); higher specificity than `.tiptap.ProseMirror > * + *` so
   this margin wins for table↔table gaps. */
/* Room above a table for a peer's name label. The label hangs ABOVE its caret
   (see the collaboration-carets rules), so for a caret in the first row it
   rises past the table's top edge — and the wrapper is a scroll container,
   which clips at its padding box, so the label was cut in half there. The room
   is therefore padding INSIDE the wrapper, taken back out of the margin above
   it so the table stays exactly where it was. A label rises at most ~10px past
   a first-row cell's top (16.8px above a caret that sits behind the cell's
   border and padding), so 16px always fits it.
   On the shell rather than the content root: the drag handle, which top-aligns
   to the wrapper and has to undo the room (.drag-handle.is-table), is the
   content root's sibling. Read with a 0 fallback, so the export page — which
   has no shell and draws no carets — lays tables out as before. */
.tiptap-editor-shell {
	--table-caret-room: 16px;
}
.tiptap.tiptap-doc-content.ProseMirror .tableWrapper {
	/* 2em in all, as before. No other block's bottom margin is more than 1em
	   (hr), so collapsing with it still leaves 2em - room above the padding. */
	margin-top: calc(2em - var(--table-caret-room, 0px));
	margin-bottom: 2em;
	padding-top: var(--table-caret-room, 0px);
	/* Scroll horizontally instead of squeezing columns when the table (whose
	   min-width prosemirror-tables sets to the summed column widths) exceeds the
	   container. */
	max-width: 100%;
	overflow-x: auto;
	/* Stated rather than left to compute as `auto`: the table no longer clips
	   its own bottom edge (see `overflow-x: clip` below), and a column-resize
	   handle reaching past the last row would make the wrapper scroll a couple
	   of pixels vertically. */
	overflow-y: hidden;
}
/* Table after table: the one neighbour whose bottom margin (2em) outweighs the
   reduced top margin, so collapsing would put the room on top of a full 2em.
   A negative margin collapses with that 2em and takes the room back off. */
.tiptap.tiptap-doc-content.ProseMirror .tableWrapper + .tableWrapper {
	margin-top: calc(-1 * var(--table-caret-room, 0px));
}
/* Tables — TipTap columnResizing needs table-layout:fixed + absolute cells +
   .column-resize-handle styles or the drag handles are invisible / inert. */
.tiptap.tiptap-doc-content table {
	border-collapse: collapse;
	margin: 0;
	/* Clipped sideways only: a column-resize handle on the right edge must not
	   widen the wrapper's scroll range, while a name label above a first-row
	   caret has to rise out of the table into the room the wrapper keeps for
	   it. `clip`, not `hidden`: only `clip` leaves the other axis `visible`. */
	overflow-x: clip;
	table-layout: fixed;
	width: 100%;
}
.tiptap.tiptap-doc-content th,
.tiptap.tiptap-doc-content td {
	border: 1px solid var(--border-main);
	box-sizing: border-box;
	min-width: 1em;
	padding: 0.4em 0.6em;
	position: relative;
	vertical-align: top;
}
/* UI 2.0's --bg-subtle, not shadcn's --muted: nothing themes --muted for dark,
   where it stayed `hsl(0 0% 3.9%)`, a near-black header band. */
.tiptap.tiptap-doc-content th {
	background: var(--bg-subtle);
	font-weight: 600;
	text-align: left;
}
/* Cell fills (table/table-cell-background) are always PALE tints painted as an
   inline background-color, so pin the text dark for them — in dark mode the
   inherited near-white foreground would be unreadable. An explicit text colour
   still wins: the Color mark renders its own inline-styled span inside. */
.tiptap.tiptap-doc-content th[data-background-color],
.tiptap.tiptap-doc-content td[data-background-color] {
	color: #1f2937;
}
/* Selected cells (a CellSelection — grip click/drag, or shift+arrows). 20% of the
   selection blue reads clearly over both white cells and coloured ones, without
   hiding the cell's own background. */
.tiptap.tiptap-doc-content .selectedCell::after {
	background: color-mix(in oklab, var(--tbl-select) 20%, transparent);
	bottom: 0;
	content: "";
	left: 0;
	pointer-events: none;
	position: absolute;
	right: 0;
	top: 0;
	z-index: 2;
}
.tiptap.tiptap-doc-content .column-resize-handle {
	background-color: var(--tbl-select);
	bottom: -2px;
	pointer-events: none;
	position: absolute;
	/* A hairline, centred on the border it drags: half either side of it. */
	right: -1px;
	top: 0;
	width: 2px;
}
.tiptap.tiptap-doc-content .tableWrapper {
	margin: 1em 0;
	overflow-x: auto;
}
.tiptap.tiptap-doc-content.resize-cursor {
	cursor: col-resize;
	cursor: ew-resize;
}

/* placeholder (empty node hint) — body editor only (title has its own rule) */
.tiptap-editor-shell .tiptap p.is-editor-empty:first-child::before,
.tiptap-editor-shell .tiptap .is-empty::before {
	content: attr(data-placeholder);
	color: var(--muted-foreground);
	float: left;
	height: 0;
	pointer-events: none;
}

/* details / toggle */
.tiptap.tiptap-doc-content .tiptap-details {
	border: 1px solid var(--border-main);
	border-radius: 8px;
	padding: 0.5em 0.75em;
	margin: 0.5em 0;
}
.tiptap.tiptap-doc-content .tiptap-details summary {
	cursor: pointer;
	font-weight: 600;
	list-style: revert;
}

/* math */
.tiptap.tiptap-doc-content [data-type="blockMath"] {
	display: block;
	text-align: center;
	margin: 0.5em 0;
}

/* mention chip: avatar + name pill */
.tiptap.tiptap-doc-content .tiptap-mention {
	display: inline-flex;
	align-items: center;
	gap: 4px;
	/* Never wider than the block it sits in. The chip is `nowrap` AND an atomic
	   inline box, so it cannot break across lines: without this cap a long name
	   inside a narrow TABLE CELL paints straight over the cell border into the
	   next column. Capped here, the name ellipsises instead (see __name) — the
	   full name stays readable via the chip's `title` tooltip. */
	max-width: 100%;
	padding: 1px 8px 1px 2px;
	border-radius: 999px;
	background: var(--accent);
	color: var(--foreground);
	font-weight: 500;
	line-height: 1.35;
	vertical-align: middle;
	white-space: nowrap;
	/* NO `user-select: none` here, however much the chip looks like chrome.
	   It is document CONTENT, and a reader dragging across a sentence expects
	   the whole sentence to light up. Chrome paints no selection over a
	   user-select:none subtree, so the chip came out as a HOLE in the
	   highlight — "hello ▮▮▮ world" with the name sitting unhighlighted in the
	   middle — and people read that as "the mention did not get copied".
	   (It always did: the DOM range spans the chip either way, and ProseMirror
	   serializes from its OWN selection, so the paste round-trip was never
	   affected. The bug was entirely what the eye was told.)
	   Nothing is lost by allowing selection: the node is an atom, so
	   ProseMirror renders it contenteditable=false and normalises any caret
	   landing inside it to the node's edges — see mention-clipboard.test.ts,
	   which locks both that and this rule's absence. `cursor: default` is what
	   keeps the chip from reading as editable text. */
	cursor: default;
}
.tiptap.tiptap-doc-content .tiptap-mention__avatar {
	flex: none;
	/* max-* guards against the `.tiptap-doc-content img { max-width:100% }` rule
	 * so a
	 * large avatar photo can never blow the chip up. */
	width: 18px;
	height: 18px;
	max-width: 18px;
	max-height: 18px;
	border-radius: 999px;
	object-fit: cover;
	background-size: cover;
	background-position: center;
}
.tiptap.tiptap-doc-content .tiptap-mention__avatar--fallback {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	font-size: 10px;
	font-weight: 600;
	line-height: 1;
	color: #fff;
}
.tiptap.tiptap-doc-content .tiptap-mention__name {
	font-size: 0.95em;
	/* `min-width: 0` is what lets this flex item shrink below its text width, so
	   the ellipsis can actually engage under the chip's max-width (the avatar is
	   `flex: none` and keeps its full size). `white-space: nowrap` is inherited
	   from the chip. */
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
}

/* remote carets + selection (CollaborationCaret uses the `collaboration-carets__*`
 * class names — note the plural "carets"). The caret is a thin vertical line at
 * the peer's cursor; the label floats above it (absolute, so it does NOT stretch
 * to full width); a remote text selection gets a translucent highlight.
 * `.tiptap-table-sticky` is the pinned table header (table-sticky-header.ts): a
 * clone of the header row in an overlay OUTSIDE the content root, which carries
 * a peer's caret over with the row but none of these rules — without them the
 * label dropped below the cell text as a bare block. */
.tiptap.tiptap-doc-content .collaboration-carets__caret,
.tiptap-table-sticky .collaboration-carets__caret {
	position: relative;
	margin-left: -1px;
	margin-right: -1px;
	border-left: 1px solid;
	border-right: 1px solid;
	/* border-color is set inline to the peer's color */
	word-break: normal;
	pointer-events: none;
}
.tiptap.tiptap-doc-content .collaboration-carets__label,
.tiptap-table-sticky .collaboration-carets__label {
	position: absolute;
	top: -1.4em;
	left: -1px;
	font-size: 12px;
	font-weight: 600;
	line-height: normal;
	white-space: nowrap;
	color: #fff;
	padding: 0.1rem 0.3rem;
	border-radius: 3px 3px 3px 0;
	user-select: none;
	pointer-events: none;
	/* Over a table's hover grip strip (1), which paints the room above the table
	   that a first-row caret's label rises into; under the pinned header's
	   backdrop (3), so a label scrolled beneath the pinned head stays beneath
	   it. See the LAYERING note in table/table.css. */
	z-index: 2;
	/* background-color is set inline to the peer's color */
}
/* remote text selection uses y-prosemirror's `.ProseMirror-yjs-selection`,
 * which already applies a translucent version of the peer's color — no extra
 * styling needed. */

/* suggestion popovers (slash / mention / emoji) */
.tiptap-suggestion-popover {
	z-index: 50;
}
.tiptap-suggestion-menu {
	min-width: 240px;
	max-height: 360px;
	overflow-y: auto;
	background: var(--popover);
	color: var(--popover-foreground);
	border: 1px solid var(--border-main);
	border-radius: 10px;
	box-shadow: 0 8px 24px rgb(0 0 0 / 0.12);
	padding: 6px;
}
.tiptap-slash-group + .tiptap-slash-group {
	margin-top: 4px;
}
.tiptap-slash-group-label {
	padding: 6px 10px 2px;
	font-size: 12px;
	line-height: 1.2;
	color: var(--muted-foreground);
	user-select: none;
}
.tiptap-suggestion-item {
	display: flex;
	align-items: center;
	gap: 10px;
	width: 100%;
	text-align: left;
	padding: 7px 10px;
	border-radius: 6px;
	font-size: 14px;
	background: none;
	border: none;
	cursor: pointer;
	color: inherit;
}
.tiptap-slash-icon {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	flex: none;
	width: 20px;
	height: 20px;
}
.tiptap-slash-title {
	flex: 1;
	min-width: 0;
}
.tiptap-mention-avatar {
	flex: none;
	width: 24px;
	height: 24px;
	border-radius: 999px;
	background-size: cover;
	background-position: center;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	font-size: 11px;
	font-weight: 600;
	line-height: 1;
	color: #fff;
	overflow: hidden;
	user-select: none;
}
.tiptap-mention-name {
	flex: 1;
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
.tiptap-suggestion-item:hover {
	background: color-mix(in srgb, var(--accent) 55%, transparent);
}
/* committed selection (keyboard target / notify-mode click) — stronger than a
   transient hover, with a left accent bar so the "armed" row is unmistakable */
.tiptap-suggestion-item.is-selected {
	background: var(--accent);
	box-shadow: inset 2px 0 0 var(--color-primary-500);
}
.tiptap-suggestion-empty {
	padding: 8px 10px;
	color: var(--muted-foreground);
	font-size: 14px;
}

/* mention popup: tabbed shell (人 / 交付物) */
.tiptap-mention-menu {
	display: flex;
	flex-direction: column;
	min-width: 260px;
	padding: 0;
	overflow: hidden;
}
.tiptap-mention-tabs {
	display: flex;
	gap: 4px;
	padding: 6px 6px 0;
	border-bottom: 1px solid var(--border-main);
}
.tiptap-mention-tab {
	appearance: none;
	background: none;
	border: none;
	border-bottom: 2px solid transparent;
	padding: 6px 10px;
	font-size: 14px;
	line-height: 1.2;
	color: var(--muted-foreground);
	cursor: pointer;
}
.tiptap-mention-tab.is-active {
	color: var(--foreground);
	border-bottom-color: var(--color-primary-500);
	font-weight: 600;
}
.tiptap-mention-list {
	max-height: 280px;
	overflow-y: auto;
	padding: 6px;
}
.tiptap-mention-search {
	position: relative;
	padding: 8px 8px 4px;
}
.tiptap-mention-search input {
	width: 100%;
	padding: 6px 28px 6px 10px;
	font-size: 14px;
	color: var(--foreground);
	background: var(--background);
	border: 1px solid var(--border-main);
	border-radius: 6px;
	outline: none;
}
.tiptap-mention-search input:focus {
	border-color: var(--color-primary-500);
}
/* In-box "still searching" indicator. Reuses the media-placeholder keyframes.
   `top`/`bottom` are the container's own paddings, i.e. the input's edges, so
   `margin: auto 0` centres on the INPUT rather than on the padded box — no
   magic offset to re-derive if either padding changes. */
.tiptap-mention-search__spinner {
	position: absolute;
	top: 8px;
	right: 17px;
	bottom: 4px;
	width: 12px;
	height: 12px;
	margin: auto 0;
	color: var(--muted-foreground);
	border: 2px solid color-mix(in oklab, currentcolor 25%, transparent);
	border-top-color: currentcolor;
	border-radius: 50%;
	box-sizing: border-box;
	animation: tiptap-media-placeholder-spin 0.8s linear infinite;
}
@media (prefers-reduced-motion: reduce) {
	.tiptap-mention-search__spinner {
		animation-duration: 2.4s;
	}
}
.tiptap-mention-footer {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 8px;
	padding: 8px 10px;
	border-top: 1px solid var(--border-main);
}
.tiptap-mention-notify {
	display: flex;
	align-items: center;
	gap: 6px;
	font-size: 13px;
	color: var(--muted-foreground);
	cursor: pointer;
	user-select: none;
}
.tiptap-mention-notify input {
	width: 14px;
	height: 14px;
	accent-color: var(--color-primary-500);
	cursor: pointer;
}
.tiptap-mention-submit {
	appearance: none;
	border: none;
	padding: 6px 16px;
	font-size: 13px;
	font-weight: 500;
	color: var(--primary-foreground);
	background: var(--color-primary-500);
	border-radius: 6px;
	cursor: pointer;
}
.tiptap-mention-submit:disabled {
	opacity: 0.5;
	cursor: not-allowed;
}

/* Card NodeViews draw their own selected ring on the CARD ([data-selected], the
   two rules below), so prosemirror-view's built-in one must go.
   `.ProseMirror-selectednode` lands on the element ProseMirror owns — the
   `react-renderer node-<name>` div that wraps a React NodeView — and that div is
   a full-width block, while the card inside is capped (360px / 520px). Its
   default `outline: 2px solid #8cf` therefore paints a light-blue box that
   overshoots the card to the right, all the way to the text column's edge.
   Deliberately per-node, not a blanket `.react-renderer` rule: every OTHER node
   view has no ring of its own and the default is the only selection feedback it
   gets. */
.tiptap.tiptap-doc-content
	.react-renderer.node-deliverable.ProseMirror-selectednode,
.tiptap.tiptap-doc-content
	.react-renderer.node-workspaceEmbed.ProseMirror-selectednode {
	outline: none;
}

/* deliverable (交付物) block embed — the memory-module artifact card. Scoped to
 * the document content class (like the mention chip) since it renders inside
 * the editor. */
.tiptap.tiptap-doc-content .tiptap-deliverable-wrap {
	margin: 8px 0;
}
.tiptap.tiptap-doc-content .tiptap-deliverable-card {
	max-width: 360px;
	border-radius: 12px;
}
/* selected node (click / keyboard) gets a focus ring like other block embeds */
.tiptap.tiptap-doc-content .tiptap-deliverable-card[data-selected="true"] {
	outline: 2px solid var(--color-primary-500);
	outline-offset: 2px;
}
/* NodeView-less rendering (HTML/PDF export, seed route DOM fallback). Same
   shape as the React card above — 360px, 12px radius — so a document that is
   downloaded does not suddenly show a different artifact card from the one on
   screen. The cover window borrows the embed's 16:9 letterbox for the same
   reason it exists there: an artifact thumbnail is a crop of something whose
   proportions we do not control, and sizing the card by it turns one tall
   screenshot into a full page. Shape via `aspect-ratio`, never `height` — the
   `.tiptap-doc-content img:not(…)` rule pins that to `auto` at a specificity no
   class here can beat. */
.tiptap.tiptap-doc-content .tiptap-deliverable {
	max-width: 360px;
	margin: 8px 0;
	border: 1px solid var(--border-main);
	border-radius: 12px;
	overflow: hidden;
}
.tiptap.tiptap-doc-content .tiptap-deliverable__cover {
	display: block;
	width: 100%;
	height: auto;
	aspect-ratio: 16 / 9;
	object-fit: contain;
	background: #fff;
	border-radius: 0;
}
.tiptap.tiptap-doc-content
	.tiptap-deliverable__cover
	+ .tiptap-deliverable__row {
	border-top: 1px solid var(--border-main);
}
.tiptap.tiptap-doc-content .tiptap-deliverable__row {
	display: flex;
	align-items: center;
	gap: 8px;
	padding: 8px 12px;
}
.tiptap.tiptap-doc-content .tiptap-deliverable__name {
	min-width: 0;
	flex: 1 1 auto;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
	font-size: 14px;
	font-weight: 500;
}
.tiptap.tiptap-doc-content .tiptap-deliverable__meta {
	flex: none;
	color: var(--muted-foreground);
	font-size: 12px;
}

/* embedded workspace (whiteboard / …): a cover thumbnail card, wider than the
   deliverable card since the cover carries the information */
.tiptap.tiptap-doc-content .tiptap-workspace-embed-wrap {
	margin: 12px 0;
}
.tiptap.tiptap-doc-content .tiptap-workspace-embed-card {
	max-width: 520px;
	border-radius: 12px;
}
.tiptap.tiptap-doc-content .tiptap-workspace-embed-card[data-selected="true"] {
	outline: 2px solid var(--color-primary-500);
	outline-offset: 2px;
}
/* NodeView-less rendering (HTML export / seed route DOM fallback).
   `.tiptap-export-embed` joins every selector in this block: an exported
   document turns a YouTube <iframe> — which no rasterizer can draw — into its
   poster frame plus the address (lib/docs/export-dom.ts), and that is the same
   object as an embedded workspace: a 16:9 window with a caption under it. One
   selector list rather than a parallel set of rules, so the two cannot drift. */
.tiptap.tiptap-doc-content .tiptap-workspace-embed,
.tiptap.tiptap-doc-content .tiptap-export-embed {
	max-width: 520px;
	border: 1px solid var(--color-neutral-200);
	border-radius: 12px;
	overflow: hidden;
}
/* THE embed window. One shape, defined once, for every embeddable type and both
   renderings — the React card and the NodeView-less DOM the seed route and HTML
   export emit — so an embed can never look like two different things depending
   on who drew it. (The card used to carry its own inline `aspect-ratio` from a
   per-type registry value while this rule hardcoded another; that is the split
   this block closes.)
   • 16:9 + the 520px cap above pin BOTH dimensions. The cover is a crop of the
     drawing's bounding box, so a card sized by its cover turns one tall sketch
     into a full-page column mid-document.
   • White, not a theme token, and in both themes: covers are exported on a
     forced white background (see captureExcalidrawCover's viewBackgroundColor),
     so the letterbox has to read as part of the picture. Change that export and
     change this together.
   • Shape comes from `aspect-ratio`, never `height` — the
     `.tiptap-doc-content img:not(…)` rule above pins that to `auto` at a
     specificity no class can beat. Nothing competes for `aspect-ratio`.
   Both selectors are embed-only: no other element in the editor is touched. */
.tiptap.tiptap-doc-content .tiptap-workspace-embed__cover,
.tiptap.tiptap-doc-content .tiptap-export-embed .tiptap-workspace-embed__cover,
.tiptap.tiptap-doc-content .tiptap-workspace-embed-card__window {
	width: 100%;
	height: auto;
	aspect-ratio: 16 / 9;
	background: #fff;
}
/* The cover IS the window (both renderings): contain centres the whole drawing
   inside it and never crops. */
.tiptap.tiptap-doc-content .tiptap-workspace-embed__cover {
	display: block;
	object-fit: contain;
}
/* No cover yet — same window, holding a centred type icon. */
.tiptap.tiptap-doc-content .tiptap-workspace-embed-card__window {
	display: flex;
	align-items: center;
	justify-content: center;
}
.tiptap.tiptap-doc-content .tiptap-workspace-embed__title {
	display: block;
	padding: 8px 12px;
	font-size: 14px;
	font-weight: 500;
}

/* bubble menu */
/* Float the selection bubble above the table insert overlay (z 20/21) and the
   drag handle (z 50) so it is never clipped by them. */
.tiptap-bubble-menu {
	z-index: 60;
	/* Entrance: the plugin re-appends the element on every show, which restarts
	   this animation. It slides toward its final spot — up when the toolbar
	   appears above the mouse, down (see data-placement below) when under it. */
	animation: tiptap-bubble-in-up 160ms ease-out;
}
.tiptap-bubble-menu[data-placement="bottom"] {
	animation-name: tiptap-bubble-in-down;
}
/* Touch screens: docked above the keyboard, centred, instead of beside the
   selection (see EditorBubbleMenu) — the system's own selection menu opens
   beside the selection on whichever side the OS picks, and would cover it.
   The plugin keeps writing floating-ui's inline left/top/width, hence
   !important. `--keyboard-inset` is the on-screen keyboard's height
   (useKeyboardInset); without a keyboard the toolbar sits above the home
   indicator instead. */
.tiptap-bubble-menu.is-docked {
	position: fixed !important;
	top: auto !important;
	right: 8px !important;
	bottom: calc(
		max(env(safe-area-inset-bottom), var(--keyboard-inset, 0px)) + 8px
	) !important;
	left: 8px !important;
	width: max-content !important;
	max-width: calc(100vw - 16px);
	margin-inline: auto;
}
/* Android (Chromium) also pans the page to keep the caret above the keyboard;
   lifted by the keyboard's height alone the toolbar would float up by that pan
   (`--visual-viewport-offset-top`, useKeyboardInset). iOS needs no correction. */
.tiptap-bubble-menu.is-docked.is-docked-pan {
	bottom: calc(
		max(
				env(safe-area-inset-bottom),
				var(--keyboard-inset, 0px) - var(--visual-viewport-offset-top, 0px)
			) +
			8px
	) !important;
}
/* A toolbar wider than a small phone wraps rather than running off it. */
.tiptap-bubble-menu.is-docked .tiptap-bubble {
	flex-wrap: wrap;
	justify-content: center;
}
/* Its menus open upward: below it is the keyboard. */
.tiptap-bubble-menu.is-docked .tiptap-bubble-pop {
	top: auto;
	bottom: 100%;
	margin-top: 0;
	margin-bottom: 6px;
}
@keyframes tiptap-bubble-in-up {
	from {
		opacity: 0;
		transform: translateY(6px);
	}
	to {
		opacity: 1;
		transform: none;
	}
}
@keyframes tiptap-bubble-in-down {
	from {
		opacity: 0;
		transform: translateY(-6px);
	}
	to {
		opacity: 1;
		transform: none;
	}
}
/* Mid-drag guard (EditorBubbleMenu): the plugin shows the toolbar as soon as
   the selection is non-empty, i.e. while the mouse is still sweeping. The
   class is set on editor mousedown and cleared on mouseup — the bubble only
   becomes visible once the selection is finished. */
.tiptap-bubble-menu.is-selecting {
	pointer-events: none;
	visibility: hidden !important;
}
.tiptap-bubble {
	display: flex;
	gap: 2px;
	padding: 4px;
	background: var(--popover);
	border: 1px solid var(--border-main);
	border-radius: 8px;
	box-shadow: 0 6px 18px rgb(0 0 0 / 0.12);
}
.tiptap-bubble-btn {
	align-items: center;
	background: none;
	border: none;
	border-radius: 6px;
	color: inherit;
	cursor: pointer;
	display: inline-flex;
	font-size: 13px;
	height: 28px;
	justify-content: center;
	min-width: 28px;
}
/* Divider between the inline marks and the block (list) conversions. */
.tiptap-bubble-sep {
	align-self: stretch;
	background: var(--border-main);
	flex: none;
	margin: 4px 2px;
	width: 1px;
}
.tiptap-bubble-btn[data-active="true"],
.tiptap-bubble-btn:hover {
	background: var(--accent);
}
/* The "A" on the colour control, wearing the remembered font/background pair.
   A rounded SQUARE, not a text-sized pill — shared by the text bubble and the
   table toolbar so the two read as one control. */
.tiptap-bubble-a {
	align-items: center;
	border-radius: 4px;
	display: inline-flex;
	font-size: 13px;
	font-weight: 600;
	height: 20px;
	justify-content: center;
	width: 20px;
}

/* Link editor popover (the bubble's chain button). Replaces window.prompt —
   see LinkButton in EditorBubbleMenu for why the browser dialog had to go. */
.tiptap-link-panel {
	width: 296px;
	padding: 8px;
	background: var(--popover);
	border: 1px solid var(--border-main);
	border-radius: 8px;
	box-shadow: 0 12px 32px rgb(0 0 0 / 0.14);
}
.tiptap-link-row {
	align-items: center;
	display: flex;
	gap: 8px;
}
.tiptap-link-input {
	background: var(--background);
	border: 1px solid var(--border-main);
	border-radius: 6px;
	color: var(--foreground);
	flex: 1 1 auto;
	font-size: 13px;
	height: 30px;
	/* Without it the flex item refuses to shrink below its content width. */
	min-width: 0;
	padding: 0 8px;
}
.tiptap-link-input:focus {
	border-color: var(--color-primary-500);
	outline: none;
}
.tiptap-link-confirm {
	background: var(--color-primary-500);
	border: none;
	border-radius: 6px;
	color: #fff;
	cursor: pointer;
	flex: none;
	font-size: 13px;
	height: 30px;
	padding: 0 12px;
}
.tiptap-link-confirm:disabled {
	cursor: not-allowed;
	opacity: 0.5;
}
.tiptap-link-remove {
	background: none;
	border: none;
	border-radius: 6px;
	color: var(--muted-foreground);
	cursor: pointer;
	font-size: 13px;
	margin-top: 6px;
	padding: 5px 0;
	width: 100%;
}
.tiptap-link-remove:hover {
	background: var(--accent);
	color: var(--foreground);
}
