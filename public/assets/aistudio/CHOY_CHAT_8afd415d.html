/* Table insert size grid (slash / gutter "+") */
.tiptap-table-size-picker {
	padding: 8px 10px 10px;
}
.tiptap-table-size-picker-header {
	align-items: center;
	color: var(--muted-foreground);
	display: flex;
	font-size: 12px;
	gap: 6px;
	margin-bottom: 8px;
}
.tiptap-table-size-picker-back {
	background: none;
	border: none;
	border-radius: 4px;
	color: inherit;
	cursor: pointer;
	font-size: 14px;
	line-height: 1;
	padding: 2px 4px;
}
.tiptap-table-size-picker-back:hover {
	background: var(--accent);
	color: var(--foreground);
}
.tiptap-table-size-grid {
	display: flex;
	flex-direction: column;
	gap: 3px;
}
.tiptap-table-size-row {
	display: flex;
	gap: 3px;
}
.tiptap-table-size-cell {
	background: var(--background);
	border: 1px solid var(--border-main);
	border-radius: 2px;
	cursor: pointer;
	height: 14px;
	padding: 0;
	width: 18px;
}
.tiptap-table-size-cell.is-active {
	background: color-mix(in oklab, var(--color-primary-500) 22%, transparent);
	border-color: var(--color-primary-500);
}

/* drag handle + block-actions menu */
.tiptap-drag-handle-wrap {
	position: relative;
}
/* The handle is the box floating-ui measures to place the gutter (x = block.left -
   handleWidth), and it measures it asynchronously, before React has committed the
   pill's content for this hover. So the handle's width is FIXED here — two
   affordance slots, whatever the pill inside it happens to render — and the pill is
   right-aligned in it, which keeps the pill's right edge on the block's left edge
   even when it shrinks to one slot (an empty block shows no drag grip). Without
   this, every hover that changed the pill's shape was placed with the previous
   block's width and the "+" landed a slot away from the text, behind a dead gap
   that hides the whole gutter when the pointer crosses it.
   The width is DERIVED from the pill's own geometry tokens (:root, above), which
   the pill's padding, border and slot buttons read back too — so the box measured
   here and the box actually painted cannot drift apart. */
.drag-handle {
	/* border-box so the trailing gap below is INSIDE the declared width: the box
	   floating-ui measures stays exactly two slots + one gap wide. */
	box-sizing: border-box;
	/* Containing block for the hover corridor below. */
	position: relative;
	display: flex;
	justify-content: flex-end;
	/* The gap to the text. The plugin lands the handle's RIGHT edge on the block's
	   left edge, so padding here — not a transform — is what moves the pill off
	   the text while keeping the gap inside the handle (i.e. hoverable). */
	padding-right: var(--gutter-text-gap);
	width: calc(
		2 * var(--gutter-slot) + 2 * var(--gutter-pill-pad) + 2 *
			var(--gutter-pill-border) + var(--gutter-text-gap)
	);
}
/* A phone: one slot, not two. The page gutter there is 44px (NARROW_CONTENT_GUTTER
   in lib/docs/page-width.ts, under a 540px page) and the two-slot handle is 52px,
   which would put half of the type icon — the part a finger uses to open the
   block menu — past the screen's left edge. The grip is the slot dropped: its drag
   is HTML5 drag-and-drop, which a touch does not start. The handle stays a fixed
   width, per the note above (32px here), and its one slot is the same for every
   block (type icon, or "+" when empty).
   Phone-sized AND touch: a touch tablet has the 66px gutter and can drag. */
@media (pointer: coarse) and (max-width: 539px) {
	.drag-handle {
		width: calc(
			var(--gutter-slot) + 2 * var(--gutter-pill-pad) + 2 *
				var(--gutter-pill-border) + var(--gutter-text-gap)
		);
	}
	/* Two classes: `.tiptap-drag-handle` (below) sets the slot's display. */
	.tiptap-drag-handle.tiptap-drag-handle--grip {
		display: none;
	}
}
/* Keep the gutter visible while its menu is open — otherwise the drag-handle
   plugin hides it once the pointer moves into the (body-portalled) menu. */
.drag-handle.is-menu-open {
	visibility: visible !important;
}
/* While text (or a node) is selected the bubble menu owns the interaction —
   hide the gutter pill entirely so the two popups never compete. Declared
   after .is-menu-open so this !important wins when both classes apply. */
.drag-handle.is-selection {
	pointer-events: none;
	visibility: hidden !important;
}
/* CARD blocks (table shell, workspace embed): the plugin puts the pill's right
   edge flush against the block's left edge, which for a card means ON its visible
   border. Inset it by one gap so it sits clear of the edge instead.
   Declared here, not in JS: it is static geometry, and a transform rides on top of
   the plugin's inline top/left instead of fighting it for the same property. */
.drag-handle.is-card {
	--card-pill-gap: 4px;
	transform: translateX(calc(-1 * var(--card-pill-gap)));
}
/* Table gutter. The plugin `left-start`-aligns the pill to the table's top-left,
   dropping it onto the first row where it overlaps the corner "+" handle. Lift
   it into the clear space just ABOVE the table's top-left corner. The corner
   insert "+" (before-first row/column) is removed (see TableInsertControls) so
   it no longer collides.
   Both axes read the SAME gap, so the pill's bottom-right corner is diagonally
   symmetric to the table's top-left corner by construction — Lark-style, with no
   pair of constants to keep in sync.
   NOTE: the lifted pill lands in the same strip as the column-insert hover band,
   and the plugin hard-codes the handle wrapper's inline `z-index: 10` — the table
   overlays therefore stay BELOW 10 so the band can't paint over the pill (see
   table/table.css).
   The plugin aligns to the WRAPPER, whose top sits --table-caret-room above the
   table's own (the room a peer's name label rises into, see .tableWrapper), so
   that much is added back: the pill keys off the table's corner, not the room. */
.drag-handle.is-table {
	transform: translate(
		calc(-1 * var(--card-pill-gap, 4px)),
		calc(-100% - var(--card-pill-gap, 4px) + var(--table-caret-room, 0px))
	);
}
/* Hover corridor — the handle's hit area extended down the hovered block's whole
   left edge. The gutter sits entirely OUTSIDE the editor DOM and the drag-handle
   plugin hides the handle on the editor's mouseleave unless the pointer lands
   inside the handle's own wrapper, so every pixel of the trip from the text out to
   the pill has to be handle. The pill alone only covers that trip from the block's
   first line; a two-line paragraph, an image, a card are all taller, and exiting
   through any lower row would drop the pointer into nothing and take the pill with
   it. This invisible strip covers the rest.
   On the HANDLE, not on the pill inside it. A pseudo-element counts as part of
   its own element for hit testing, so while the corridor hung off the pill,
   entering the corridor WAS entering the pill: on a tall block, sliding left out
   of the lower rows — nowhere near the pill, merely below it — raised the
   quick-action panel. The two jobs are separate. The corridor keeps the pointer
   inside the handle so the plugin holds the pill on screen; the pill, and only
   the pill, opens the panel.
   Applies to EVERY block, not just cards: the exposure is the block's height, which
   nothing about the block's TYPE bounds. `--gutter-block-h` is the hovered block's
   live height, published by DocDragHandle (onNodeChange + a ResizeObserver, so it
   tracks a card that grows while hovered); `100%` is the pill, the floor for a
   block shorter than it and the fallback if the variable is ever missing.
   It MUST reach all the way back to the block's left edge, or any uncovered sliver
   is a dead zone: crossing it makes the plugin hide the pill mid-travel. The
   handle's own `padding-right` already spans the `--gutter-text-gap`, so only the
   extra `--card-pill-gap` a card is inset by is left to reach across.
   It stays clear of the editor DOM on the other side: the doc's ProseMirror element
   has no horizontal padding, so the block's left edge IS the editor's, and the
   corridor never swallows a click meant for the text.
   `z-index: -1` keeps the strip behind the pill's own buttons so it can't swallow
   their clicks, while still taking the pointer in the empty sliver. */
.drag-handle::after {
	content: "";
	position: absolute;
	z-index: -1;
	left: 0;
	right: calc(-1 * var(--card-pill-gap, 0px));
	top: 0;
	height: max(100%, var(--gutter-block-h, 0px));
}
/* A table's pill is lifted a full pill-height + gap ABOVE the table's top-left
   corner (see .is-table), so its corridor has that much further to reach down.
   The block height is the wrapper's, which counts the label room above the
   table the pill has already been moved past — so that much comes off. */
.drag-handle.is-table::after {
	height: calc(
		100% + var(--card-pill-gap, 0px) + var(--gutter-block-h, 0px) -
			var(--table-caret-room, 0px)
	);
}
/* Lark-style gutter pill: a bordered, rounded card holding the "+" insert and
   the ⠿ drag grip. */
.tiptap-drag-handle-group {
	position: relative;
	display: flex;
	align-items: center;
	gap: 0;
	padding: var(--gutter-pill-pad);
	border: var(--gutter-pill-border) solid var(--border-main);
	border-radius: 8px;
	background: var(--popover);
	box-shadow: 0 1px 2px rgb(0 0 0 / 0.06);
}
.tiptap-drag-handle {
	width: var(--gutter-slot);
	height: 22px;
	display: flex;
	align-items: center;
	justify-content: center;
	color: var(--muted-foreground);
	cursor: grab;
	border-radius: 4px;
	border: none;
	background: none;
	padding: 0;
}
.tiptap-drag-handle:hover {
	background: var(--accent);
}
/* "+" insert affordance — clicks (not drags) to open the block picker. */
.tiptap-drag-handle--add {
	cursor: pointer;
}
.tiptap-insert-menu {
	z-index: 50;
}
/* Table-size grid flyout beside the insert menu: sized to the grid, not the
   list's min-width, and never scrolls. */
.tiptap-insert-flyout {
	min-width: 0;
	max-height: none;
	overflow: visible;
}

/* doc header: title (blank) or compact toolbar (imported). No background of its
   own: it is not sticky, and the body below it paints none either, so both sit
   on whatever the page draws. A `--bg-main` fill here was invisible on 1.0's
   white page but drew a band across the top of every document opened in the
   library, whose page is UI 2.0's atmosphere. */
.tiptap-doc-header {
	display: flex;
	flex-shrink: 0;
	flex-direction: column;
	gap: 0.75rem;
	overflow: visible;
	padding-top: 3.5rem;
	padding-bottom: 0.75rem;
}
.tiptap-doc-header--untitled {
	gap: 0;
	padding-top: 0.75rem;
	padding-bottom: 0.5rem;
	margin-bottom: 0.75rem;
}
.tiptap-doc-toolbar {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 0.75rem;
	min-height: 2rem;
}
.tiptap-title .ProseMirror {
	outline: none;
	font-size: 2rem;
	font-weight: 700;
	line-height: 1.25;
	color: var(--foreground);
}
.tiptap-title-placeholder {
	margin: 0;
	font-size: 2rem;
	font-weight: 700;
	line-height: 1.25;
	color: var(--foreground);
}
.tiptap-title .ProseMirror p {
	margin: 0;
}
.tiptap-title .ProseMirror p.is-editor-empty:first-child::before {
	content: attr(data-placeholder);
	color: var(--muted-foreground);
	float: left;
	height: 0;
	pointer-events: none;
}

/* Compact title: the /docs chrome row, for the workspace types with no in-body
   DocHeader (docx / whiteboard). Sized to the read-only <h1> it replaces so
   upgrading it to a real editor is invisible until the user clicks in. Single
   line — the schema already allows only one paragraph; this keeps a long name
   from wrapping the 44px chrome row, scrolling instead of clipping the caret. */
.tiptap-title--compact .ProseMirror {
	font-size: 15px;
	font-weight: 500;
	line-height: 1.4;
	white-space: nowrap;
	overflow-x: auto;
	scrollbar-width: none;
}
.tiptap-title--compact .ProseMirror::-webkit-scrollbar {
	display: none;
}
.tiptap-title-placeholder--compact {
	font-size: 15px;
	font-weight: 500;
	line-height: 1.4;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}
.tiptap-doc-meta {
	display: flex;
	align-items: center;
	gap: 0.4rem;
	min-width: 0;
	margin: 0;
	overflow: visible;
	font-size: 13px;
	line-height: 1.4;
	color: var(--muted-foreground);
}
.tiptap-doc-meta-avatar {
	width: 20px;
	height: 20px;
	border-radius: 999px;
	background-color: var(--accent);
	background-size: cover;
	background-position: center;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	font-size: 11px;
	font-weight: 600;
	color: var(--foreground);
	overflow: hidden;
}
.tiptap-doc-meta-name {
	color: var(--foreground);
}
/* The author line arrives whole once the name is known (see AuthorMeta). */
.tiptap-doc-meta--ready {
	animation: tiptap-doc-meta-in 160ms ease-out;
}
@keyframes tiptap-doc-meta-in {
	from {
		opacity: 0;
	}
	to {
		opacity: 1;
	}
}
@media (prefers-reduced-motion: reduce) {
	.tiptap-doc-meta--ready {
		animation: none;
	}
}
.tiptap-doc-meta-sep {
	opacity: 0.5;
}

/* presence roster (who's in the room) */
.tiptap-roster {
	display: flex;
	align-items: center;
}
.tiptap-roster-avatar {
	width: 28px;
	height: 28px;
	margin-left: -8px;
	border-radius: 999px;
	border: 2px solid var(--background);
	background-size: cover;
	background-position: center;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	font-size: 12px;
	font-weight: 600;
	color: #fff;
	overflow: hidden;
}
.tiptap-roster-avatar:first-child {
	margin-left: 0;
}
.tiptap-roster-more {
	margin-left: 6px;
	font-size: 12px;
	color: var(--muted-foreground);
}
/* The stack is the button that opens the list, so it needs the reset a bare
   <button> does not get here, and a focus ring the mouse never sees. */
.tiptap-roster-trigger {
	appearance: none;
	padding: 0;
	border: 0;
	background: none;
	cursor: pointer;
	border-radius: 999px;
}
.tiptap-roster-trigger:focus-visible {
	outline: 2px solid var(--ring);
	outline-offset: 2px;
}
.tiptap-roster-row {
	display: flex;
	width: 100%;
	align-items: center;
	gap: 8px;
	padding: 6px 8px;
	border-radius: 6px;
	font-size: 13px;
	color: var(--foreground);
	background: none;
	border: 0;
	text-align: left;
}
.tiptap-roster-row-action {
	cursor: pointer;
}
.tiptap-roster-row-action:hover {
	background: var(--accent);
}
.tiptap-roster-row-action:focus-visible {
	outline: 2px solid var(--ring);
	outline-offset: -2px;
}

/* Drag-handle table menu: on/off switch + section divider (menu is portaled to
   <body>, so these classes are global like the other suggestion-menu styles).
   The table insert/cell-add overlay styles live in table/table.css. */
.tiptap-menu-switch {
	flex: none;
	margin-left: auto;
	position: relative;
	width: 30px;
	height: 18px;
	border-radius: 999px;
	background: var(--bg-subtle);
	transition: background 0.15s ease;
}
.tiptap-menu-switch[data-on="true"] {
	background: var(--color-primary-500);
}
.tiptap-menu-switch::after {
	content: "";
	position: absolute;
	top: 2px;
	left: 2px;
	width: 14px;
	height: 14px;
	border-radius: 999px;
	background: #fff;
	transition: transform 0.15s ease;
}
.tiptap-menu-switch[data-on="true"]::after {
	transform: translateX(12px);
}
/* Trailing "›" on a menu row that opens a nested picker (e.g. 在下方添加). */
.tiptap-menu-chevron {
	flex: none;
	display: flex;
	align-items: center;
	margin-left: auto;
	color: var(--muted-foreground);
}
.tiptap-menu-divider {
	height: 1px;
	margin: 4px 6px;
	background: var(--border-main);
}

/* ── Block quick-action panel (hover the gutter pill; DocDragHandle) ── */
.tiptap-block-menu {
	min-width: 232px;
	max-height: none;
	overflow: visible;
	/* Slides in from the side it opened on, which the placement effect
	   publishes as `data-placement`. The element remounts on every open, which
	   restarts the animation. */
	animation: tiptap-panel-in-left 150ms ease-out;
}
.tiptap-block-menu[data-placement="bottom"] {
	animation-name: tiptap-panel-in-down;
}
.tiptap-block-menu[data-placement="top"] {
	animation-name: tiptap-panel-in-up;
}
/* Its submenus fly out to the RIGHT: slide in from the left + fade. Keyed by
   submenu kind in JSX so switching rows replays the animation. */
.tiptap-panel-flyout {
	animation: tiptap-panel-in-right 150ms ease-out;
}
@keyframes tiptap-panel-in-left {
	from {
		opacity: 0;
		transform: translateX(8px);
	}
	to {
		opacity: 1;
		transform: none;
	}
}
@keyframes tiptap-panel-in-right {
	from {
		opacity: 0;
		transform: translateX(-8px);
	}
	to {
		opacity: 1;
		transform: none;
	}
}
@keyframes tiptap-panel-in-down {
	from {
		opacity: 0;
		transform: translateY(-8px);
	}
	to {
		opacity: 1;
		transform: none;
	}
}
@keyframes tiptap-panel-in-up {
	from {
		opacity: 0;
		transform: translateY(8px);
	}
	to {
		opacity: 1;
		transform: none;
	}
}
.tiptap-block-menu-grid {
	display: grid;
	grid-template-columns: repeat(6, 1fr);
	gap: 2px;
	padding: 6px 8px 2px;
}
.tiptap-block-menu-cell {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	height: 28px;
	padding: 0;
	border: none;
	border-radius: 6px;
	background: none;
	color: var(--foreground);
	cursor: pointer;
}
.tiptap-block-menu-cell:hover {
	background: var(--accent);
}
.tiptap-block-menu-cell[data-active="true"] {
	background: rgb(59 130 246 / 0.12);
	color: var(--tbl-select);
}
.tiptap-suggestion-item:disabled {
	opacity: 0.4;
	cursor: default;
}
.tiptap-suggestion-item:disabled:hover {
	background: none;
}
/* A row that is offered but cannot be used HERE, saying why underneath
   (EmbedSubpageMenuItem). `aria-disabled` rather than `disabled`: the reason
   has to stay readable and reachable, so only the action is dimmed. */
.tiptap-suggestion-item[aria-disabled="true"] {
	cursor: default;
}
.tiptap-suggestion-item[aria-disabled="true"]:hover {
	background: none;
}
.tiptap-suggestion-item[aria-disabled="true"] > .tiptap-slash-icon,
.tiptap-suggestion-item[aria-disabled="true"] .tiptap-slash-label {
	opacity: 0.45;
}
.tiptap-slash-label {
	display: block;
}
.tiptap-slash-note {
	display: block;
	max-width: 13.5rem;
	margin-top: 2px;
	font-size: 12px;
	line-height: 1.35;
	color: var(--muted-foreground);
	white-space: normal;
}
.tiptap-menu-check {
	flex: none;
	margin-left: auto;
	color: var(--tbl-select);
	font-size: 13px;
}
/* Color submenu */
.tiptap-color-panel {
	width: 224px;
	padding: 8px 10px 10px;
	/* Inherits the popover's corner so a sheet flush with its edges (the table
	   toolbar's, which drops its own padding for one) never squares it off. */
	border-radius: inherit;
}
.tiptap-color-label {
	margin: 2px 0 6px;
	font-size: 12px;
	color: var(--muted-foreground);
}
.tiptap-color-row {
	display: flex;
	gap: 4px;
	margin-bottom: 6px;
}
.tiptap-color-swatch {
	width: 24px;
	height: 24px;
	padding: 0;
	border: 1px solid var(--border-main);
	border-radius: 6px;
	background: var(--popover);
	cursor: pointer;
}
.tiptap-color-swatch:hover {
	box-shadow: 0 0 0 2px rgb(59 130 246 / 0.35);
}
.tiptap-color-swatch--font {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	background: none;
	font-size: 13px;
	font-weight: 600;
	color: var(--foreground);
}
/* "No background" swatch: a diagonal strike. */
.tiptap-color-swatch[data-none="true"]:not(.tiptap-color-swatch--font) {
	background-image: linear-gradient(
		135deg,
		transparent 46%,
		#ef4444 46%,
		#ef4444 54%,
		transparent 54%
	);
}
.tiptap-color-reset {
	width: 100%;
	margin-top: 2px;
	padding: 6px 0;
	border: 1px solid var(--border-main);
	border-radius: 6px;
	background: none;
	color: var(--foreground);
	font-size: 13px;
	cursor: pointer;
}
.tiptap-color-reset:hover {
	background: var(--accent);
}

/* The edge band that opens a line beside a picture (media-line-insert.ts)
   draws nothing over the document — the cursor is the whole hint. */
.tiptap.tiptap-doc-content.tiptap-media-line-ready {
	cursor: pointer;
}

/* The picture toolbar (ui/MediaHoverToolbar): the same chrome as the text
   bubble, positioned from the picture's own rect rather than by a selection. */
.tiptap-media-hover-toolbar {
	position: fixed;
	z-index: 60;
	animation: tiptap-bubble-in-up 160ms ease-out;
}
.tiptap-media-hover-toolbar[data-placement="bottom"] {
	animation-name: tiptap-bubble-in-down;
}

/* ── Document links in three forms (#2387) ──────────────────────────────────
   The inline title chip (`docMention`): the document's icon and title, read as
   a link — underlined title, no pill, so a sentence with one in it still reads
   as a sentence. One rule for the NodeView's <button> and the NodeView-less
   <a> (seed, export), so the two cannot drift. */
.tiptap .tiptap-doc-mention {
	display: inline-flex;
	align-items: baseline;
	gap: 3px;
	max-width: 100%;
	padding: 0 3px;
	border: none;
	border-radius: 4px;
	background: none;
	color: inherit;
	font: inherit;
	line-height: inherit;
	text-decoration: none;
	vertical-align: baseline;
	cursor: pointer;
}
.tiptap .tiptap-doc-mention:hover,
.tiptap .tiptap-doc-mention[data-selected="true"] {
	background: var(--accent);
}
.tiptap .tiptap-doc-mention[data-selected="true"] {
	outline: 2px solid var(--ring);
	outline-offset: 0;
}
.tiptap .tiptap-doc-mention__icon {
	flex: none;
	width: 1em;
	height: 1em;
	align-self: center;
	color: var(--muted-foreground);
}
.tiptap .tiptap-doc-mention__title,
.tiptap a.tiptap-doc-mention {
	overflow: hidden;
	font-weight: 500;
	text-decoration: underline;
	text-decoration-color: var(--border-main);
	text-underline-offset: 3px;
	text-overflow: ellipsis;
	white-space: nowrap;
}
.tiptap .tiptap-doc-mention[data-refused="true"],
.tiptap .tiptap-doc-mention[data-gone="true"] {
	opacity: 0.6;
	filter: grayscale(1);
}
.tiptap .tiptap-doc-mention[data-gone="true"] {
	cursor: default;
}

/* The "paste as" menu and the hover toolbar: the shared bubble chrome, fixed
   to the viewport like the media toolbar, each form a labelled button. */
.tiptap-doc-link-menu {
	position: fixed;
	z-index: 60;
	align-items: center;
	animation: tiptap-bubble-in-down 160ms ease-out;
}
.tiptap-doc-link-menu[data-placement="top"] {
	animation-name: tiptap-bubble-in-up;
}
.tiptap-doc-link-menu__label {
	padding: 0 6px;
	color: var(--muted-foreground);
	font-size: 12px;
	white-space: nowrap;
}
.tiptap-bubble-btn.tiptap-doc-link-form {
	gap: 4px;
	padding: 0 8px;
	white-space: nowrap;
}
.tiptap-bubble-btn.tiptap-doc-link-form:disabled {
	cursor: default;
	opacity: 0.4;
}
.tiptap-bubble-btn.tiptap-doc-link-form:disabled:hover {
	background: none;
}

/* Styles for the table module overlay UI (TableInsertControls + TableCellAddButton).
   Imported by table/TableControls.tsx after the base editor stylesheet. Table NODE
   rendering styles (table/th/td/.tableWrapper/column-resize) stay in tiptap-editor.css. */

/* LAYERING — everything here is placed relative to z-index 10, which the
   drag-handle plugin hard-codes on the wrapper holding the gutter pill (and that
   wrapper is its own stacking context, so the pill can never straddle it):
     • the hover BAND must stay BELOW 10. It spans the strip the lifted table pill
       sits in, so above 10 it paints over the pill — reads as "the pill is half
       hidden behind a gray box".
     • the insert HANDLES and the in-cell "+" must stay ABOVE 10. The pill's
       invisible hover bridge (.tiptap-drag-handle-group::after) covers the
       table's whole left edge, so below 10 it swallows their clicks.
   The two overlays therefore must NOT set a z-index of their own: that would
   create a stacking context and trap their children on one side of 10.
   Around the band, in the same stacking context: a peer's name label (2), the
   pinned header's backdrop (3) and the pinned header itself (7). A label has to
   clear the band, which paints over the very room above a table that a
   first-row caret's label rises into, yet stay under the pinned header — so the
   band's scrolling segments go under all of them (1), and its pinned segments
   (6) go between the pinned header's backdrop and its copy, which is
   transparent where they lie except for a label rising out of a header cell. */

/* In-cell "+" that opens the block-insert picker (adds content INTO the cell).
   Overlay lives inside the editor shell, beside the ProseMirror content. */
.tiptap-editor-shell .tiptap-cell-add-overlay {
	position: absolute;
	inset: 0;
	pointer-events: none;
}
/* The pill itself reuses `.tiptap-drag-handle-group` (border/bg/icon) from the
   gutter handle; this only positions it just outside the cell's left edge. */
.tiptap-editor-shell .tiptap-cell-add-pill {
	position: absolute;
	z-index: 21;
	transform: translate(-50%, -50%);
	pointer-events: auto;
}

/* Lark-style table insert handles — an overlay inside the editor shell (beside
 * the ProseMirror content, not inside `.tiptap`), so scope it to the shell. */
.tiptap-editor-shell .tiptap-table-insert {
	position: absolute;
	inset: 0;
	pointer-events: none;
}
/* Lark's grip strip: one segment per column along the table's top edge and one
   per row along its left edge, flush against each other so they read as a single
   gray band, with a 1px seam between segments. `data-hover` darkens the segment
   under the pointer and `data-selected` paints the selected column/row blue —
   both driven from JS, because the segments MUST stay pointer-events: none (see
   the TableInsertControls header: real elements here hide the gutter pill). */
.tiptap-editor-shell .tiptap-table-insert__grip {
	position: absolute;
	/* Under a peer's name label (2) — see the LAYERING note above. The band is
	   the only thing it would cover: it lies in the room the wrapper keeps
	   above the table, and the row strip lies outside the table's left edge. */
	z-index: 1;
	background: var(--bg-subtle);
	transition: background-color 0.12s ease;
	pointer-events: none;
}
.tiptap-editor-shell .tiptap-table-insert__grip--col {
	box-shadow: inset -1px 0 0 var(--bg-main);
}
.tiptap-editor-shell .tiptap-table-insert__grip--row {
	box-shadow: inset 0 -1px 0 var(--bg-main);
}
/* A pinned segment covers the scrolling ones: those are laid out in the
   content and lag a frame behind a wheel tick, which would otherwise flash
   through the pinned head. Over the pinned header's backdrop (3), under the
   pinned copy (7) — see the LAYERING note above. */
.tiptap-editor-shell .tiptap-table-insert__grip[data-pinned="true"] {
	z-index: 6;
}
.tiptap-editor-shell .tiptap-table-insert__grip[data-hover="true"] {
	background: color-mix(
		in oklab,
		var(--muted-foreground) 28%,
		var(--bg-subtle)
	);
}
/* Selected line: the solid blue bar Lark shows over the selected column/row —
   same --tbl-select as the cell tint and the insert dots (see tiptap-editor.css). */
.tiptap-editor-shell .tiptap-table-insert__grip[data-selected="true"] {
	background: var(--tbl-select);
}
/* The handle IS the hit/click target (a transparent button); the visual "+"
   dot inside is purely decorative. A generous 24px box makes it easy to hit. */
.tiptap-editor-shell .tiptap-table-insert__handle {
	position: absolute;
	z-index: 21;
	width: 24px;
	height: 24px;
	transform: translate(-50%, -50%);
	padding: 0;
	border: 0;
	background: transparent;
	cursor: pointer;
	pointer-events: auto;
}
/* Default: a subtle gray dot sitting in the band. On handle hover it grows into
   the blue "+" (the "+" glyph is hidden until then). */
.tiptap-editor-shell .tiptap-table-insert__dot {
	position: absolute;
	left: 50%;
	top: 50%;
	display: flex;
	width: 4px;
	height: 4px;
	align-items: center;
	justify-content: center;
	border: 0 solid #fff;
	border-radius: 999px;
	background: var(--muted-foreground);
	color: transparent;
	font-size: 0;
	line-height: 1;
	opacity: 0.45;
	transform: translate(-50%, -50%);
	transition: all 0.12s ease;
	pointer-events: none;
}
.tiptap-editor-shell
	.tiptap-table-insert__handle:hover
	.tiptap-table-insert__dot {
	width: 16px;
	height: 16px;
	border-width: 2px;
	background: var(--tbl-select);
	color: #fff;
	font-size: 13px;
	opacity: 1;
}
.tiptap-editor-shell .tiptap-table-insert__tip {
	position: absolute;
	bottom: calc(100% + 6px);
	left: 50%;
	transform: translateX(-50%);
	padding: 3px 8px;
	border-radius: 6px;
	background: #1f2937;
	color: #fff;
	font-size: 12px;
	white-space: nowrap;
	opacity: 0;
	transition: opacity 0.12s ease;
	pointer-events: none;
}
.tiptap-editor-shell
	.tiptap-table-insert__handle:hover
	.tiptap-table-insert__tip {
	opacity: 1;
}
.tiptap-editor-shell .tiptap-table-insert__line {
	position: absolute;
	left: 50%;
	top: 50%;
	background: var(--tbl-select);
	opacity: 0;
	transition: opacity 0.12s ease;
	pointer-events: none;
}
.tiptap-editor-shell
	.tiptap-table-insert__handle--col
	.tiptap-table-insert__line {
	width: 2px;
	transform: translateX(-50%);
}
.tiptap-editor-shell
	.tiptap-table-insert__handle--row
	.tiptap-table-insert__line {
	height: 2px;
	transform: translateY(-50%);
}
.tiptap-editor-shell
	.tiptap-table-insert__handle:hover
	.tiptap-table-insert__line {
	opacity: 0.55;
}

/* ── Column/row toolbar (TableSelectionToolbar) ──────────────────────────────
   Portalled to <body> and positioned in JS, so it is NOT scoped to the shell.
   Above the bubble menu's z-index 60 — a cell selection dismisses that menu, but
   the drag pill (10) and the insert dots (21) can both sit under this. */
.tiptap-table-toolbar {
	align-items: center;
	color: var(--foreground);
	position: fixed;
	z-index: 70;
	/* Entrance: the same two keyframes the text bubble slides in with
	   (tiptap-editor.css), floating up toward a bar placed above the selection
	   and down toward one placed below it. The bar is mounted fresh for every
	   selection, which is what restarts this. */
	animation: tiptap-bubble-in-up 160ms ease-out;
}
.tiptap-table-toolbar[data-placement="bottom"] {
	animation-name: tiptap-bubble-in-down;
}
/* Popover anchored under the trigger that opened it (JS sets `left`, and nudges
   `transform` when it would overflow the viewport). */
.tiptap-table-toolbar__pop {
	position: absolute;
	top: calc(100% + 6px);
	min-width: 160px;
	padding: 4px;
	border: 1px solid var(--border-main);
	/* Same token Tailwind's rounded-lg resolves to in the bubble dropdowns. */
	border-radius: var(--radius-lg);
	background: var(--popover);
	box-shadow: 0 12px 32px rgb(0 0 0 / 0.14);
}
/* A colour sheet fills its own width (.tiptap-color-panel) — no min-width. */
.tiptap-table-toolbar__pop:has(.tiptap-color-panel) {
	min-width: 0;
	padding: 0;
}
.tiptap-table-toolbar__menu-item {
	display: flex;
	width: 100%;
	align-items: center;
	gap: 8px;
	padding: 6px 8px;
	border: none;
	/* rounded-md, as in the bubble dropdown's rows. */
	border-radius: var(--radius-md);
	background: none;
	color: inherit;
	cursor: pointer;
	font-size: 14px;
	text-align: left;
	white-space: nowrap;
}
.tiptap-table-toolbar__menu-item:hover {
	background: var(--accent);
	color: var(--accent-foreground);
}
.tiptap-table-toolbar__menu-item[data-danger="true"] {
	color: #ef4444;
}
/* Pinned header row (table-sticky-header.ts) — a clone in a fixed overlay in
   the editor shell, so it repeats the cell chrome that .tiptap's own rules
   give the real table. Pointer-events off: it is a reading aid, presses
   belong to the document underneath. Below the toolbars (60/70), above the
   content. */
.tiptap-table-sticky {
	position: fixed;
	/* Over the pinned grip strip (6): transparent in the reserve the strip
	   paints into, except for a peer's name label rising out of a header cell,
	   which has to read over the strip as it does on the real table. Under the
	   pill (10) and the insert dots (21) — see the LAYERING note at the top of
	   this file. The page colour beneath is the backdrop's. */
	z-index: 7;
	overflow: hidden;
	pointer-events: none;
}
/* What the pinned copy is painted on, in the copy's box (table-sticky-header.ts
   gives the two the same one). The reserve above the cloned row is what lies
   above a table's top edge: page background, with the grip strip painting
   into it on hover — so this sits UNDER the pinned strip (6), and over the
   document text it covers, peers' name labels (2) included. No shadow — it
   would outline the box down both sides. */
.tiptap-table-sticky-backdrop {
	position: fixed;
	z-index: 3;
	pointer-events: none;
	/* The sheet under a document is the atmosphere, a gradient over a base
	   colour with no token of its own; --bg-main is the nearest solid. */
	background: var(--bg-main);
}
.tiptap-table-sticky[hidden],
.tiptap-table-sticky-backdrop[hidden] {
	display: none;
}
.tiptap-table-sticky table {
	position: absolute;
	top: 0;
	left: 0;
	border-collapse: collapse;
	table-layout: fixed;
	margin: 0;
	/* Clips like the real table does — sideways only. A peer's name label
	   above a header-cell caret rises out of the real table into the room its
	   wrapper keeps (--table-caret-room); here it rises into the reserve above
	   the copy, which is taller than that room. */
	overflow-x: clip;
}
.tiptap-table-sticky th,
.tiptap-table-sticky td {
	border: 1px solid var(--border-main);
	box-sizing: border-box;
	min-width: 1em;
	padding: 0.4em 0.6em;
	vertical-align: top;
}
.tiptap-table-sticky th {
	background: var(--bg-subtle);
	font-weight: 600;
	text-align: left;
}
/* Covers the strip's band so the editor underneath never sees a pointer it
   would offer a column-resize cursor for — the press there selects a column.
   Height is set from GRIP_HEAD_RESERVE in table-sticky-header.ts. */
.tiptap-table-sticky__shield {
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	cursor: default;
	pointer-events: auto;
}
.tiptap-table-sticky p {
	margin: 0;
}
/* The cells anchor what they contain — the selection tint and the width
   drag's guide line are both absolutely positioned inside them. */
.tiptap-table-sticky th,
.tiptap-table-sticky td {
	position: relative;
}
/* The column guide continued through the pinned head. Placed from the real
   line's measured x (table-sticky-header.ts) rather than copied with the row,
   so the two never read as two lines. */
.tiptap-table-sticky__guide {
	position: absolute;
	bottom: 0;
	background-color: var(--tbl-select);
	pointer-events: none;
}
.tiptap-table-sticky__guide[hidden] {
	display: none;
}
/* Selecting the header row has to show in the pinned copy too: the clone
   carries the .selectedCell class over, but none of .tiptap's rules. */
.tiptap-table-sticky .selectedCell::after {
	position: absolute;
	inset: 0;
	background: color-mix(in oklab, var(--tbl-select) 20%, transparent);
	content: "";
	pointer-events: none;
}

/* Floating horizontal scrollbar for a wide table whose own bar is still
   below the fold (table-floating-scrollbar.ts). Same overlay idea as the
   pinned header, but interactive — hence pointer-events on the track. */
.tiptap-table-hscroll {
	position: fixed;
	z-index: 40;
	height: 12px;
	pointer-events: none;
}
.tiptap-table-hscroll[hidden] {
	display: none;
}
.tiptap-table-hscroll__track {
	position: absolute;
	inset: 0;
	border-radius: 6px;
	/* Painted like the table's own (native) bar it stands in for: the app's
	   scrollbar, no track (styles.css, --app-scrollbar-thumb). */
	background: transparent;
	pointer-events: auto;
}
.tiptap-table-hscroll__thumb {
	position: absolute;
	top: 2px;
	bottom: 2px;
	left: 0;
	border-radius: 4px;
	background: var(--app-scrollbar-thumb);
	cursor: grab;
}
.tiptap-table-hscroll__thumb[data-dragging="true"] {
	cursor: grabbing;
}

/* The label takes the slack so the check mark parks on the right edge. */
.tiptap-table-toolbar__menu-label {
	flex: 1;
}

.doc-export *,
.doc-export *::before,
.doc-export *::after {
	box-sizing: border-box;
}
.doc-export__title {
	margin: 0 0 4px;
}
/* The body's own top padding, which the editor gets from the shell
   (".tiptap-editor-shell .tiptap.ProseMirror") — the shell, and its 30vh of
   click-below-the-text tail, are not exported. */
.doc-export__body {
	padding: 1rem 0 0;
	font-size: 1rem;
	line-height: 1.6;
	color: var(--foreground);
}

/* ── Editor furniture: present in the app, meaningless in a file ── */
.doc-export .ProseMirror-gapcursor,
.doc-export .ProseMirror-separator,
.doc-export .drag-handle,
.doc-export .tiptap-drag-handle-group,
.doc-export .tiptap-bubble-menu,
.doc-export .tiptap-table-insert,
.doc-export .tiptap-table-hscroll,
.doc-export .tiptap-media-placeholder,
.doc-export [data-resize-handle],
.doc-export [class^="collaboration-carets__"],
.doc-export [class*=" collaboration-carets__"] {
	display: none !important;
}
/* A placeholder is a prompt to type, and an empty paragraph in a file is an
   empty paragraph. */
.doc-export .is-empty::before,
.doc-export .is-editor-empty::before {
	content: none !important;
}

/* ── Pagination. A picture cut in half across two pages is the single most
      reported thing about an exported document. ── */
.doc-export h1,
.doc-export h2,
.doc-export h3,
.doc-export h4 {
	break-after: avoid;
	page-break-after: avoid;
}
/* ONLY BLOCKS THAT OWN THEIR OWN LINE.
 *
 * html2pdf does not honour 'break-inside' by re-laying anything out. It walks
 * every element, and where one straddles a page boundary it INSERTS A BLOCK
 * '<div>' before it, tall enough to push it onto the next page. Before a
 * paragraph or a list row that is harmless. Before a picture — which lives
 * INSIDE a paragraph, the image node being inline — it drops a block box into
 * the middle of that paragraph, splitting the line and moving the picture out
 * from under the text it belongs to.
 *
 * So the picture is not asked to avoid a break; the PARAGRAPH it sits in is,
 * and a picture inside a paragraph that fits on one page cannot be split
 * anyway. Same for 'img' and the resize wrapper — both named explicitly as
 * 'auto', because html2pdf reads the COMPUTED value and would otherwise
 * inherit an 'avoid' from somewhere else and start inserting boxes again. */
.doc-export p,
.doc-export pre,
.doc-export blockquote,
.doc-export tr,
.doc-export li,
.doc-export .tiptap-video-file,
.doc-export .tiptap-workspace-embed,
.doc-export .tiptap-deliverable {
	break-inside: avoid;
	page-break-inside: avoid;
}
.doc-export img,
.doc-export [data-resize-container],
.doc-export [data-resize-wrapper] {
	break-inside: auto;
	page-break-inside: auto;
}
.doc-export thead {
	display: table-header-group;
}

/* ── What the rasterizer cannot lay out ──
 *
 * html2canvas has NO FLEX LAYOUT. It walks the DOM and draws each box, and for
 * a flex container it drops the text inside entirely — the box is painted, the
 * words are not. That is the "@name shows as an empty pill" report: the mention
 * chip is 'inline-flex', so the PDF got the grey pill with nothing in it. The
 * video card and the artifact card are the same shape of bug.
 *
 * Verified by rendering these exact rules through html2canvas in headless
 * Chromium and diffing against the browser's own paint of the same DOM: with
 * them the two are indistinguishable, without them the chip, the file name and
 * the file size are all missing.
 *
 * EVERY SELECTOR HERE CARRIES '.tiptap.tiptap-doc-content', and that is not
 * decoration: the rules being corrected are written at that scope, so
 * '.doc-export .tiptap-mention' (0,2,0) loses to
 * '.tiptap.tiptap-doc-content .tiptap-mention' (0,3,0) and the override silently
 * does nothing — which is exactly how the first attempt at this failed while
 * looking right on screen, where flex works.
 */
/* A mention is written out as text (see flattenMentions), so all it needs is
   not to break across a line. */
.doc-export .doc-export__mention {
	white-space: nowrap;
}

/* The two cards keep their horizontal shape as a table row — the one
   side-by-side layout the rasterizer does understand. */
.doc-export .tiptap.tiptap-doc-content .tiptap-video-file__open {
	display: table;
}
.doc-export .tiptap.tiptap-doc-content .tiptap-video-file__icon,
.doc-export .tiptap.tiptap-doc-content .tiptap-video-file__meta,
.doc-export .tiptap.tiptap-doc-content .tiptap-video-file__play {
	display: table-cell;
	vertical-align: middle;
}
.doc-export .tiptap.tiptap-doc-content .tiptap-video-file__meta {
	width: 100%;
	padding: 0 12px;
}
/* '-webkit-line-clamp' needs 'display: -webkit-box', which the rasterizer draws
   as nothing. A file name wraps in a file instead of being clipped to two
   lines — there is no hover here to reveal the rest. */
.doc-export .tiptap.tiptap-doc-content .tiptap-video-file__name {
	display: block;
	overflow: visible;
}
.doc-export .tiptap.tiptap-doc-content .tiptap-deliverable__row {
	display: table;
	width: 100%;
}
.doc-export .tiptap.tiptap-doc-content .tiptap-deliverable__name,
.doc-export .tiptap.tiptap-doc-content .tiptap-deliverable__meta {
	display: table-cell;
	vertical-align: middle;
	overflow: visible;
	text-overflow: clip;
}
.doc-export .tiptap.tiptap-doc-content .tiptap-deliverable__meta {
	text-align: right;
	white-space: nowrap;
}
/* A cover keeps its OWN proportions rather than the 16:9 letterbox it has on
   screen: the rasterizer ignores 'object-fit', so a picture that should have
   been contained came out stretched to fill the window. A correctly shaped
   picture is worth more in a file than a letterbox that distorts it. */
.doc-export
	.tiptap.tiptap-doc-content
	.tiptap-workspace-embed__cover,
.doc-export .tiptap.tiptap-doc-content .tiptap-deliverable__cover {
	aspect-ratio: auto;
	height: auto;
	object-fit: fill;
}

/* ── List markers, drawn as content ──
 *
 * A browser's own 'list-style' marker sits OUTSIDE the content box and is
 * right-aligned to it, so a two-digit number hangs further left than a
 * one-digit one. On screen that hangs harmlessly into the editor's page
 * padding. An exported page has no padding to hang into, so '10.' overflowed
 * the captured element and was CLIPPED — the PDF showed '0.', and the numbers
 * did not line up with each other. The rasterizer also places markers at its
 * own offsets, which is a second, smaller disagreement with the screen.
 *
 * So the export writes the markers itself (export-dom.ts) into a fixed-width,
 * right-aligned box inside the list's padding: every number in a list starts
 * and ends at the same x, nothing hangs outside the page, and there is nothing
 * left for the rasterizer to guess at. 'position: absolute' keeps the marker
 * out of the text flow, so the first line is not shifted.
 *
 * 'user-select: none' so copying a list out of the exported .html gives the
 * text without the numbers, the way copying a real list does.
 */
.doc-export .tiptap.tiptap-doc-content .doc-export__list {
	list-style: none;
	padding-left: 1.9em;
}
.doc-export .tiptap.tiptap-doc-content .doc-export__marker {
	display: inline-block;
	/* A hanging indent in NORMAL FLOW, not an absolutely positioned box.
	   -1.75 + 1.55 + 0.2 = 0, so the marker hangs entirely in the list's
	   padding and the row's text still starts exactly at the content edge.
	   Absolute positioning would need 'position: relative' on every <li>, and
	   html2canvas paints positioned boxes in a late pass, after the in-flow
	   content around them — which takes a whole list out of the order the rest
	   of the page is drawn in. */
	width: 1.55em;
	margin-left: -1.75em;
	margin-right: 0.2em;
	text-align: right;
	user-select: none;
}

/* ── A list row that carries only a picture ──
 *
 * The marker goes INSIDE the row's first block (export-dom.ts), and a block
 * holding nothing but pictures is laid out by the sheet as a BLOCK-level flex
 * box — which an inline marker cannot share a line with, so the number took a
 * line of its own above the picture while the browser's own marker sits beside
 * it.
 *
 * Marked in the DOM rather than asked for in CSS, for the same reason
 * '.tiptap-image-row' is: what decides it is the ABSENCE of text, and a text
 * node is not something ':has()' can see.
 *
 * The paragraph is forced back to 'block' for a second reason — an images-only
 * row is 'display: flex', and the rasterizer paints a flex box and drops the
 * text inside it, which would lose the marker altogether rather than merely
 * misplace it.
 *
 * '!important' because the rule being corrected carries the specificity of the
 * two attribute selectors inside its ':has()', which puts it at (0,6,1) —
 * above anything this selector can reach without repeating classes for the
 * arithmetic's sake. */
.doc-export .tiptap.tiptap-doc-content p.doc-export__media-row {
	display: block !important;
}
.doc-export
	.tiptap.tiptap-doc-content
	p.doc-export__media-row
	> [data-node="image"] {
	display: inline-flex !important;
	width: auto !important;
	vertical-align: top;
}
/* The room an images-only row gets from its 'gap', which block layout has not. */
.doc-export
	.tiptap.tiptap-doc-content
	p.doc-export__media-row
	> [data-node="image"]
	+ [data-node="image"] {
	margin-inline-start: 0.25rem;
}

/* ── html2canvas's own font probe ──
 *
 * The rasterizer works out where a line of text sits by appending a hidden 1x1
 * GIF beside a sample span and reading 'img.offsetTop - span.offsetTop'
 * (FontMetrics.parseMetrics). That difference is the font's ascent only while
 * the probe is INLINE — and the base reset above, which is Preflight's, makes
 * EVERY <img> 'display: block'. The probe then drops onto a line of its own and
 * the number that comes back is a whole line box, so every run of text in the
 * capture is painted 5-8px BELOW where the browser puts it while boxes and
 * pictures keep their exact rects. Measured on a downloaded PDF: text ink began
 * 11.8px into a 25.6px line box instead of 4px and ended 2px past the bottom of
 * it — in a list row carrying a picture the words came down ON the picture,
 * which reads as the picture having crept up into them.
 *
 * A RULE and not an 'onclone': the probe is appended to the LIVE document
 * ('new FontMetrics(document)'), which the clone callback never sees. No
 * '.doc-export' scope for the same reason — the probe is a child of <body>,
 * outside the exported page. It is matched on the exact bytes html2canvas uses
 * for that image, so nothing the document itself contains answers this
 * selector, and the sheet is only in the page while an export is running
 * (mountOffscreen), so no other picture in the app is reached either. */
img[width="1"][height="1"][src^="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP"] {
	display: inline !important;
	vertical-align: baseline !important;
}
/* The SAME probe, measured a second time to place a line-through: the image is
 * moved to 'vertical-align: super' and the distance read again. That reading
 * comes back equal to the baseline — a 1px image is not raised enough to
 * survive 'offsetTop' rounding — so the rasterizer drew every strikethrough ON
 * the baseline, where it reads as an underline rather than as struck-out text.
 *
 * A quarter of an em above the baseline is where a strikethrough belongs, and
 * stating it here is how it reaches a number the rasterizer computes for
 * itself. Matched on the inline style the probe carries in that second pass,
 * so ONLY that pass is answered — the first measurement, which places every
 * line of text on the page, is left exactly as it was. 'middle' has one use in
 * html2canvas 1.4.1 and this is it. */
img[width="1"][height="1"][src^="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP"][style*="vertical-align: super"] {
	vertical-align: 0.25em !important;
}

/* ── html2pdf's own container ──
 *
 * html2pdf clones the page into a container of its own and captures THAT, and
 * it sizes the container to the PDF's printable width — about 688px for A4 at
 * these margins. Left alone, the document is re-flowed to 688px before the
 * picture is taken: lines break in different places from the document on
 * screen, and a picture keeping its stored pixel width takes a visibly larger
 * share of the narrower column.
 *
 * Pinning the container to the document's OWN column instead means the capture
 * is the document, and html2pdf's last step — drawing the canvas across the
 * page's printable width — becomes a plain proportional scale of it. Same line
 * breaks, same proportions, just smaller type on the page.
 *
 * '!important' because html2pdf writes the width as an inline style, and the
 * overlay's 'overflow: hidden' has to go with it or a viewport narrower than
 * the column clips the capture. Both class names are html2pdf's documented
 * ones (alongside 'html2pdf__page-break').
 */
.html2pdf__container {
	width: 820px !important;
	left: 0 !important;
	right: auto !important;
	margin: 0 !important;
}
.html2pdf__overlay {
	overflow: visible !important;
}

@page {
	size: A4 portrait;
	margin: 16mm 14mm;
}
@media print {
	html,
	body {
		background: #ffffff;
	}
}
</style>
</head>
<body>
<div class="doc-export"><h1 class="tiptap-title-placeholder doc-export__title">CHOY CHAT</h1><div class="tiptap tiptap-doc-content ProseMirror doc-export__body"><p>CHOY CHAT</p><p></p><pre><code class="hljs">Choy Chat</code></pre><p></p></div></div>
</body>
</html>
