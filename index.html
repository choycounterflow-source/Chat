<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choy Chat</title>
    <meta name="description" content="Choy Chat — Social media, messaging, video calls, and milestone dashboard." />
    <meta property="og:title" content="Choy Chat" />
    <meta property="og:description" content="Choy Chat — Social media, messaging, video calls, and milestone dashboard." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#022c22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChoyChat" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" href="/favicon.ico" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('choychat_theme_mode') || 'dark';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#022c22' : '#ecfdf5');
          var scale = localStorage.getItem('choychat_font_scale');
          if (scale === 'compact' || scale === 'standard' || scale === 'large') {
            root.setAttribute('data-font-scale', scale);
          }
          if (localStorage.getItem('choychat_reduced_motion') === 'true') {
            root.setAttribute('data-reduced-motion', 'true');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-emerald-50 text-emerald-950 dark:bg-emerald-950 dark:text-slate-100 antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
